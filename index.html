<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#00562c">
<title>PERROQUET JUNIOR — Gestion des établissements secondaires privés</title>
<link rel="manifest" href="manifest.json">
<style>
:root{--navy:#00562c;--navy2:#00843d;--acc:#f77f00;--ok:#059669;--bad:#c4372d;--warn:#b7791f;--bg:#f6f9f7;--card:#fff;--tx:#14211a;--mut:#5d6b64;--bd:#e1e9e4;--r:12px;--sh:0 1px 2px rgba(0,60,30,.06),0 4px 14px rgba(0,60,30,.05)}
*{box-sizing:border-box}html,body{margin:0;height:100%}
body{font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;color:var(--tx);background:var(--bg)}
h1,h2,h3,h4{margin:0 0 .4em;line-height:1.2}h2{font-size:20px}h3{font-size:16px}h4{font-size:14px}
a{color:var(--navy2)}button{font:inherit}
.muted{color:var(--mut)}.small{font-size:12px}.right{text-align:right}.center{text-align:center}.nowrap{white-space:nowrap}
.hide{display:none!important}[hidden]{display:none!important}
/* login */
#login{min-height:100%;display:flex;align-items:flex-start;justify-content:center;padding:20px;overflow:auto;background:radial-gradient(ellipse 80% 60% at 15% 50%,rgba(255,150,40,.55) 0%,transparent 70%),radial-gradient(ellipse 70% 80% at 85% 30%,rgba(230,110,0,.45) 0%,transparent 65%),linear-gradient(160deg,#ff8f1f 0%,#e87200 35%,#a84a00 70%,#4a1f00 100%)}
#login::before{content:'';position:fixed;inset:0;pointer-events:none;background-image:linear-gradient(rgba(255,255,255,.07) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.07) 1px,transparent 1px);background-size:60px 60px;opacity:.5}
.lbox{position:relative;margin:auto;width:100%;max-width:400px;background:#f7faf8;border-radius:20px;overflow:hidden;box-shadow:0 24px 70px rgba(0,0,0,.4)}
.lh{background:linear-gradient(135deg,#00b368 0%,#009e60 45%,#007a3d 100%);padding:26px 20px 20px;text-align:center;color:#fff}
.lh .arm{display:inline-block;background:#fff;border-radius:6px;padding:0;box-shadow:0 4px 14px rgba(0,0,0,.25)}.lh .arm img{display:block;width:124px;height:auto}
.lh h1{margin:14px 0 8px;font-size:16px;letter-spacing:1.4px;font-weight:800}
.lh .pill{display:inline-block;font-size:11.5px;letter-spacing:.8px;padding:5px 14px;border-radius:99px;background:rgba(255,255,255,.22);border:1px solid rgba(255,255,255,.35)}
.lb{padding:26px 30px 8px}.lb h2{margin:0 0 4px;font-size:22px;color:#111}.lb .sb{color:#5d6b64;font-size:13px;margin-bottom:18px}
.lb label{font-size:11.5px;letter-spacing:.5px;text-transform:uppercase;color:#4b5563;font-weight:700}
.lb input{background:#fff;border:1px solid #e1e9e4;border-radius:10px;padding:11px 12px;margin-top:5px}
.pwr{position:relative}.pwr button{position:absolute;right:6px;top:50%;transform:translateY(-35%);background:none;border:0;cursor:pointer;font-size:17px;opacity:.75}
.lbtn{width:100%;margin-top:16px;border:0;border-radius:10px;padding:13px;font-size:15px;font-weight:700;color:#fff;cursor:pointer;background:linear-gradient(135deg,#00b368,#00843d);box-shadow:0 4px 12px rgba(0,132,61,.35)}
.lbtn.org{margin-top:10px;background:linear-gradient(135deg,#ff9a1f,#f77f00);box-shadow:0 4px 12px rgba(247,127,0,.35)}
.lsec{text-align:center;font-size:11px;color:#8a948e;margin:14px 0 4px}
.lcon{margin:12px 16px 0;border:1px solid #bfe6d0;background:#eaf8f0;border-radius:10px;text-align:center;padding:9px 10px;font-size:12px;font-weight:700;color:#006b3f}
.ldb{text-align:center;margin:10px 0 4px}.ldb span{display:inline-block;background:#ffefd9;color:#8a4b00;border-radius:99px;font-size:11.5px;font-weight:700;padding:5px 14px}
.pfoot{margin-top:auto;border-top:1px solid #dfe8e2;margin-left:22px;margin-right:22px;margin-bottom:18px;padding:12px 4px;text-align:center;font-size:11px;color:#6b776f;line-height:1.55}.sft{margin:18px 6px 4px;padding-top:10px;border-top:1px solid rgba(255,255,255,.18);font-size:10px;line-height:1.5;color:#b9d6c6;text-align:center}.lab{margin:12px 16px 0;padding:10px 12px;border:1px solid #e1e9e4;border-radius:10px;background:#f7faf8;font-size:11.5px;color:#34413a;line-height:1.5}.lab summary{cursor:pointer;font-weight:700;color:#0a6b3d}.lab ul{margin:6px 0 0;padding-left:16px}.lab li{margin:2px 0}@media print{.pfoot,.sft{display:none}}
.lft{border-top:1px solid #e1e9e4;margin-top:10px;padding:10px 16px 14px;text-align:center;font-size:10.5px;color:#7b867f;line-height:1.5}
.pimg{width:46px;height:46px;border-radius:50%;object-fit:cover;border:3px solid #f77f00;background:#fff;flex:none}
#side{border-right:4px solid #f77f00}
.logo{display:flex;align-items:center;gap:12px;margin-bottom:6px}
.logo .mk{width:46px;height:46px;border-radius:12px;background:var(--navy);color:var(--acc);display:grid;place-items:center;font-weight:800;font-size:19px;letter-spacing:.5px}
.logo b{font-size:20px;letter-spacing:.6px;color:var(--navy)}.logo span{display:block;font-size:11px;color:var(--mut);letter-spacing:.2px}
.demo{margin-top:14px;border:1px dashed var(--bd);border-radius:10px;padding:10px;font-size:12px;background:#f9fbf9}
.demo table{width:100%;border-collapse:collapse}.demo td{padding:2px 4px}.demo tr[data-act=fillLogin]{cursor:pointer}.demo tr[data-act=fillLogin]:hover{background:#eef3ff}
/* shell */
#shell{display:grid;grid-template-columns:262px 1fr;min-height:100%}
#side{background:var(--navy);color:#d3e8dc;position:sticky;top:0;height:100vh;overflow:auto;padding:14px 10px 24px}
#side .logo b{color:#fff}#side .logo span{color:#9fb2d9}
.mg{font-size:10.5px;text-transform:uppercase;letter-spacing:1.1px;color:#7f95c4;margin:16px 10px 6px}
.mi{display:flex;align-items:center;gap:10px;width:100%;padding:8px 10px;border:0;background:none;color:inherit;border-radius:9px;cursor:pointer;text-align:left;font-size:13.5px}
.mi:hover{background:rgba(255,255,255,.08)}.mi.on{background:var(--acc);color:#2a1500;font-weight:600}
.mi i{width:20px;text-align:center;font-style:normal;opacity:.95}
#main{min-width:0;display:flex;flex-direction:column}
#top{position:sticky;top:0;z-index:20;background:rgba(255,255,255,.94);backdrop-filter:blur(6px);border-bottom:1px solid var(--bd);display:flex;gap:10px;align-items:center;padding:8px 18px;flex-wrap:wrap}
#top select{max-width:230px}.grow{flex:1}
#view{padding:20px 22px 60px;max-width:1500px;width:100%}
.burger{display:none}
.badge{display:inline-block;padding:2px 9px;border-radius:99px;font-size:11.5px;font-weight:600;background:#e3f2ea;color:var(--navy);white-space:nowrap}
.b-ok{background:#dcf5e8;color:#0d6b3c}.b-bad{background:#fde3e0;color:#9b241b}.b-warn{background:#fdf0d4;color:#8a5a0a}.b-mut{background:#eceff5;color:#55617a}.b-acc{background:#ffe9cf;color:#8a4b00}
.dot{width:9px;height:9px;border-radius:50%;display:inline-block;margin-right:5px;background:var(--ok)}.dot.off{background:var(--bad)}
/* components */
.card{background:var(--card);border:1px solid var(--bd);border-radius:var(--r);padding:16px;box-shadow:var(--sh);margin-bottom:16px}
.card h3{margin-bottom:10px}
.ph{display:flex;align-items:flex-start;gap:12px;flex-wrap:wrap;margin-bottom:16px}.ph h2{margin:0}.ph .sub{color:var(--mut);margin-top:2px}.ph .acts{display:flex;gap:8px;flex-wrap:wrap;margin-left:auto}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px;margin-bottom:16px}
.kpi{background:#fff;border:1px solid var(--bd);border-radius:var(--r);padding:14px 16px;box-shadow:var(--sh);border-left:4px solid var(--navy2)}
.kpi .v{font-size:26px;font-weight:750;color:var(--navy);line-height:1.1}.kpi .l{color:var(--mut);font-size:12.5px;margin-top:3px}.kpi.w{border-left-color:var(--acc)}.kpi.g{border-left-color:var(--ok)}.kpi.r{border-left-color:var(--bad)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:16px;align-items:start}
.btn{background:var(--navy2);color:#fff;border:0;border-radius:9px;padding:8px 14px;cursor:pointer;font-weight:600;display:inline-flex;gap:6px;align-items:center}
.btn:hover{background:var(--navy)}.btn.acc{background:var(--acc);color:#2a1500}.btn.ok{background:var(--ok)}.btn.bad{background:var(--bad)}
.btn.ghost{background:#fff;color:var(--navy2);border:1px solid var(--bd)}.btn.ghost:hover{background:#eef7f2}.btn.sm{padding:4px 9px;font-size:12.5px;border-radius:7px}.btn[disabled]{opacity:.5;cursor:not-allowed}
label{display:block;font-size:12.5px;font-weight:600;color:#33415f;margin-bottom:3px}
input,select,textarea{width:100%;font:inherit;padding:8px 10px;border:1px solid #cfdad3;border-radius:8px;background:#fff;color:var(--tx)}
input:focus,select:focus,textarea:focus{outline:2px solid #86d3ac;border-color:var(--navy2)}
input[type=checkbox]{width:auto}.fld.full{grid-column:1/-1}.fld .hp{font-size:11.5px;color:var(--mut);margin-top:2px}
.bar{display:flex;gap:10px;flex-wrap:wrap;align-items:end;margin-bottom:12px}.bar>div{min-width:150px}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--bd);margin-bottom:14px;flex-wrap:wrap}
.tab{padding:8px 14px;border:0;background:none;cursor:pointer;border-bottom:3px solid transparent;color:var(--mut);font-weight:600}.tab.on{color:var(--navy);border-color:var(--acc)}
.tw{overflow:auto;border:1px solid var(--bd);border-radius:10px;background:#fff}
table{border-collapse:collapse;width:100%}th,td{padding:7px 10px;border-bottom:1px solid #edf0f6;text-align:left;vertical-align:middle}
th{background:#f5f8fd;font-size:12px;text-transform:uppercase;letter-spacing:.4px;color:#4a5878;position:sticky;top:0;white-space:nowrap}
tr:last-child td{border-bottom:0}tbody tr:hover{background:#f8fbf9}td.empty{text-align:center;color:var(--mut);padding:22px}
td .btn{margin-right:4px}td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
.low{color:var(--bad);font-weight:700}.hi{color:var(--ok);font-weight:700}
.alert{border-radius:10px;padding:10px 14px;margin-bottom:12px;border:1px solid;font-size:13px}.al-w{background:#fff7e6;border-color:#f3d79a;color:#6a4a07}.al-i{background:#eef4ff;border-color:#c5d6f7;color:#1d3f85}.al-r{background:#fdecea;border-color:#f3b8b2;color:#8a2119}.al-g{background:#e8f8ef;border-color:#b5e3c9;color:#0d6b3c}
.hb{display:grid;grid-template-columns:140px 1fr 60px;gap:8px;align-items:center;margin:5px 0;font-size:12.5px}.hb .t{height:16px;background:#edf2ef;border-radius:5px;overflow:hidden}.hb .t i{display:block;height:100%;background:linear-gradient(90deg,var(--navy2),#34c27a);border-radius:5px}.hb .lb{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* modal & toast */
.mback{position:fixed;inset:0;background:rgba(10,20,45,.55);z-index:100;display:grid;place-items:start center;padding:4vh 12px;overflow:auto}
.mbox{background:#fff;border-radius:14px;padding:20px;width:100%;max-width:640px;box-shadow:0 20px 60px rgba(0,0,0,.35)}.mbox.wide{max-width:1050px}
.mfoot{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}
#toast{position:fixed;right:16px;bottom:16px;z-index:200;display:flex;flex-direction:column;gap:8px}
.tst{background:#0b2a1a;color:#fff;padding:10px 14px;border-radius:10px;box-shadow:0 6px 20px rgba(0,0,0,.3);max-width:360px;animation:in .2s}.tst.err{background:var(--bad)}.tst.ok{background:var(--ok)}
@keyframes in{from{opacity:0;transform:translateY(8px)}}
.bell{position:relative}.bell .n{position:absolute;top:-4px;right:-4px;background:var(--bad);color:#fff;border-radius:99px;font-size:10px;padding:1px 5px}
.nl{max-height:60vh;overflow:auto}.ni{padding:9px 4px;border-bottom:1px solid var(--bd)}.ni.un{background:#fff6e8}
/* bulletin */
.bul{background:#fff;color:#000;font-family:Georgia,"Times New Roman",serif;font-size:12.5px;padding:18px 22px;border:1px solid #333;position:relative;margin-bottom:14px;page-break-after:always}
.bul h4{text-align:center;margin:2px 0}.bul .hd{display:flex;justify-content:space-between;gap:10px;font-size:11px;text-align:center}.bul .hd>div{flex:1}
.bul table{font-size:12px}.bul th{background:#e9ecf3;position:static;color:#000;border:1px solid #444;text-transform:none;font-size:12px}.bul td{border:1px solid #444;padding:4px 7px}
.bul .wm{position:absolute;inset:0;display:grid;place-items:center;font-size:84px;color:rgba(200,40,40,.12);transform:rotate(-24deg);pointer-events:none;font-weight:800;letter-spacing:6px}
.bul .sg{display:flex;justify-content:space-around;margin-top:26px;font-size:12px}
#printArea{display:none}
.dh{display:flex;align-items:center;justify-content:space-between;gap:12px;border-bottom:3px double #00562c;padding-bottom:8px;margin-bottom:10px;font-family:Georgia,serif;color:#000}
.dh .dl,.dh .dr{width:100px;display:flex;align-items:center}.dh .dr{justify-content:flex-end}.dh .dl{justify-content:flex-start}
.dh .dc{flex:1;text-align:center;font-size:12px;line-height:1.35}.dh .dc b{font-size:14px;text-transform:uppercase}
.dh img.lg{max-height:78px;max-width:100px}.dh img.ar{max-height:84px;max-width:100px}
.sgn{margin-top:24px;font-size:12px;font-family:Georgia,serif;color:#000;page-break-inside:avoid}.sgn .sgr{display:flex;justify-content:flex-end;gap:40px;margin-top:6px}
.sgn .sgc{text-align:center;min-width:170px}.sgn .sgc img{display:block;margin:4px auto;max-height:80px;max-width:190px}.sgn .sgc img.ct{max-height:95px;max-width:130px}
.sgn .sgc div.blank{height:70px}
.rpt h3{text-align:center;margin:10px 0 2px;font-size:17px;text-transform:uppercase}.rpt h5{margin:14px 0 4px;font-size:13.5px;color:#00562c}.rpt p{margin:4px 0;text-align:justify;line-height:1.5}
.sgpad{border:2px dashed #9bb3a6;border-radius:10px;background:#fff;touch-action:none;display:block;width:100%;cursor:crosshair}
.sgprev{border:1px solid var(--bd);border-radius:10px;background:repeating-conic-gradient(#f4f4f4 0 25%,#fff 0 50%) 0 0/16px 16px;min-height:90px;display:grid;place-items:center;padding:8px}.sgprev img{max-width:100%;max-height:140px}
.rps{border:1px solid var(--bd);border-radius:10px;padding:10px;margin-bottom:10px;background:#fafcfb}
.dd{display:grid;gap:8px;grid-template-columns:1fr 1fr}.dd .btn{justify-content:center}
.imp-ok{color:var(--ok);font-weight:700}.imp-err{color:var(--bad)}
.mback.top2{z-index:200}
@media print{body>*:not(#printArea){display:none!important}#printArea{display:block!important}.bul{border:0;margin:0;padding:8mm}@page{size:A4;margin:8mm}}
@media(max-width:1024px){#shell{grid-template-columns:1fr}#side{position:fixed;left:0;top:0;width:272px;z-index:60;transform:translateX(-102%);transition:.2s}body.nav #side{transform:none;box-shadow:0 0 40px rgba(0,0,0,.4)}.burger{display:inline-flex}#view{padding:14px 12px 50px}}
@media(max-width:640px){.grid2{grid-template-columns:1fr}.hb{grid-template-columns:90px 1fr 48px}#top select{max-width:46vw}.cols{grid-template-columns:1fr}}
</style>
</head>
<body>
<div id="login" hidden></div>
<div id="shell" hidden>
  <aside id="side"></aside>
  <div id="main"><header id="top"></header><main id="view"></main><footer id="mfoot" class="pfoot"></footer></div>
</div>
<div id="modal"></div><div id="toast"></div><div id="printArea"></div>

function cyrb(s){let h1=0xdeadbeef,h2=0x41c6ce57;for(let i=0;i<s.length;i++){const c=s.charCodeAt(i);h1=Math.imul(h1^c,2654435761);h2=Math.imul(h2^c,1597334677)}h1=Math.imul(h1^h1>>>16,2246822507)^Math.imul(h2^h2>>>13,3266489909);h2=Math.imul(h2^h2>>>16,2246822507)^Math.imul(h1^h1>>>13,3266489909);return(4294967296*(2097151&h2)+(h1>>>0)).toString(16)}
async function sha(s){try{if(crypto.subtle){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s));return[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}}catch(e){}return'x'+cyrb(s)+cyrb(s.split('').reverse().join(''))}

function save(c,rec){
  if(!S.user)throw new Error('Session requise');
  const isNew=!rec.id||!col(c)[rec.id];rec.id=rec.id||uid();
  if(SCOPED.has(c)){rec.etab=rec.etab||S.etab;if(!inScope(rec.etab))throw new Error('Opération hors de votre périmètre')}

  if(pend)throw new Error('Conflit de synchronisation à résoudre avant modification');

  rec._v=baseV;rec._t=nowISO();col(c)[rec.id]=rec;invalidate(c);
  enqueue(c,rec,isNew?'create':'update',baseV);

/* ---------- synchronisation (serveur simulé = base « cloud » séparée) ---------- */
function syncNow(){
  if(!isOnline())return{n:0};let n=0,c=0,rej=0;
  for(const op of QUEUE){
    if(op.status!=='en_attente')continue;op.status='en_cours';
    const cl=CLOUD.data[op.coll]||(CLOUD.data[op.coll]={});const cur=cl[op.id];
    if(CLOUD.applied[op.op_id]){op.status='synchronise';continue}
    if(op.coll==='paiements'){const dup=Object.values(cl).find(p=>!p._del&&p.etab===op.payload.etab&&p.reference===op.payload.reference&&p.id!==op.id);if(dup){op.status='rejete';op.reason='Référence de paiement déjà enregistrée (anti-doublon)';rej++;const lc=col(op.coll)[op.id];if(lc&&(op.type==='create'||!lc._v)){lc._del=true;invalidate()}continue}}
    if((op.type==='create'&&cur)||(op.type==='update'&&cur&&cur._v!==op.base_v)){op.status='conflit';op.server=clone(cur);c++;continue}
    const nv=(cur?cur._v:0)+1;cl[op.id]={...clone(op.payload),_v:nv};CLOUD.applied[op.op_id]=1;
    const loc=col(op.coll)[op.id];if(loc)loc._v=nv;op.status='synchronise';op.synced=nowISO();n++;
  }
  for(const j of JOURNAL){if(!j.sent){CLOUD.journal.push(j);j.sent=true}}
  // purge de la file : on garde les 200 dernières opérations terminées
  const done=QUEUE.filter(o=>o.status==='synchronise');if(done.length>200){const rm=new Set(done.slice(0,done.length-200));QUEUE=QUEUE.filter(o=>!rm.has(o))}
  META.lastSync=nowISO();persistSoon();if(typeof drawTop==='function')drawTop();
  if(S.route==='sync'&&typeof render==='function')render();
  return{n,c,rej};
}
function pullCloud(){let n=0;for(const[c,m]of Object.entries(CLOUD.data)){for(const r of Object.values(m)){if(SCOPED.has(c)&&!inScope(r.etab))continue;if(c==='etablissements'&&!inScope(r.id))continue;if(c==='utilisateurs'&&!(S.user.role==='superadmin'||r.id===S.user.id||(r.etab_id&&inScope(r.etab_id))))continue;const l=col(c)[r.id];const pend=QUEUE.some(o=>o.coll===c&&o.id===r.id&&['en_attente','conflit'].includes(o.status));if(!pend&&(!l||l._v<r._v)){col(c)[r.id]=clone(r);n++}}}if(n){invalidate();persistSoon()}return n}

/* ============ Moteur de notes, moyennes, rangs, bulletins ============ */
/* Règles : zéro (0) ≠ absent ≠ dispensé ≠ non saisi.
   - 0 compte comme une note ; absent / dispensé / non saisi sont exclus du calcul (mais signalés) ;
   - moyenne de matière = moyenne pondérée (poids par type d'évaluation, paramétrable) des notes ramenées sur 20 ;
   - moyenne générale = Σ(moyenne matière × coef) / Σ(coef des matières prises en compte) — formule paramétrable. */
function noteMap(){if(!IDX.notes){IDX.notes={};for(const n of all('notes'))IDX.notes[n.evaluation_id+'|'+n.inscription_id]=n}return IDX.notes}
function evalsOf(classe,trim){const k='ev|'+classe+'|'+trim;return IDX[k]||(IDX[k]=all('evaluations').filter(e=>e.classe_id===classe&&e.trimestre===trim))}
function coefsOf(cl){const k='cf|'+cl.etab+'|'+cl.annee+'|'+cl.niveau;return IDX[k]||(IDX[k]=all('coefficients').filter(x=>x.etab===cl.etab&&x.annee===cl.annee&&x.niveau===cl.niveau&&x.coef>0).map(x=>({code:x.matiere,nom:matNom(x.matiere),coef:x.coef})).sort((a,b)=>b.coef-a.coef||a.nom.localeCompare(b.nom)))}
function moyMat(inscId,classe,mat,trim,valOnly,pd){
  const nm=noteMap();let s=0,w=0,miss=0,abs=0,disp=0,nonval=0,cnt=0;
  for(const ev of evalsOf(classe,trim)){if(ev.matiere!==mat)continue;if(valOnly&&ev.statut!=='valide'){nonval++;continue}
    const n=nm[ev.id+'|'+inscId];
    if(!n||(n.etat==='note'&&(n.valeur==null||n.valeur===''))){miss++;continue}
    if(n.etat==='absent'){abs++;continue}if(n.etat==='dispense'){disp++;continue}
    const wt=pd.poids[ev.type]??1;s+=(n.valeur/ev.bareme*20)*wt;w+=wt;cnt++}
  return{moy:w?r2(s/w):null,miss,abs,disp,nonval,cnt}}
function rankRows(rows,key){const v=rows.filter(r=>r[key]!=null).map(r=>r[key]).sort((a,b)=>b-a);rows.forEach(r=>{if(r[key]==null){r.rang=null;return}r.rang=1+v.filter(x=>x>r[key]).length;r.ex=v.filter(x=>x===r[key]).length>1})}

  const key='cc|'+classe+'|'+trim+'|'+valOnly;if(IDX[key])return IDX[key];
  const cl=get('classes',classe);if(!cl)return{mats:[],rows:[],stats:{},cl:null};const pd=settingsOf(cl.etab);const mats=coefsOf(cl);
  const rows=activeInsc(classe).map(i=>{const e=get('eleves',i.eleve_id);const m={};let s=0,w=0,miss=0,incompl=false,nonval=0;
    for(const mt of mats){const r=moyMat(i.id,classe,mt.code,trim,valOnly,pd);m[mt.code]=r;if(r.moy!=null){s+=r.moy*mt.coef;w+=mt.coef}else incompl=true;miss+=r.miss;nonval+=r.nonval}
    let mg=w?r2(s/w):null;if(pd.formule==='toutes'&&incompl)mg=null;return{insc:i,eleve:e,m,mg,miss,incompl,nonval}}).sort((a,b)=>eleveName(a.eleve).localeCompare(eleveName(b.eleve)));
  rankRows(rows,'mg');
  const mgs=rows.filter(r=>r.mg!=null).map(r=>r.mg);
  const stats={n:rows.length,nCalc:mgs.length,moy:mgs.length?r2(mean(mgs)):null,min:mgs.length?Math.min(...mgs):null,max:mgs.length?Math.max(...mgs):null,taux:mgs.length?Math.round(mgs.filter(x=>x>=pd.seuil).length/mgs.length*100):null,seuil:pd.seuil,parMat:{}};
  for(const mt of mats){const v=rows.map(r=>r.m[mt.code].moy).filter(x=>x!=null);stats.parMat[mt.code]={moy:v.length?r2(mean(v)):null,min:v.length?Math.min(...v):null,max:v.length?Math.max(...v):null}}
  const evs=evalsOf(classe,trim);const nonVal=evs.filter(e=>e.statut!=='valide');

function calcAnnuel(classe){
  const key='ca|'+classe;if(IDX[key])return IDX[key];
  const cl=get('classes',classe);const T=[1,2,3].map(t=>calcClasse(classe,t));

function statEtab(etabId,trim=1){
  const ins=all('inscriptions').filter(i=>i.etab===etabId&&i.annee===S.annee&&['inscrit','reintegre'].includes(i.statut));
  const cls=all('classes').filter(c=>c.etab===etabId&&c.annee===S.annee);const mgs=[];let miss=0,nonVal=0;const parNiv={};
  for(const c of cls){const r=calcClasse(c.id,trim);r.rows.forEach(x=>{if(x.mg!=null)mgs.push(x.mg)});miss+=r.miss;nonVal+=r.nonVal.length;const p=parNiv[c.niveau]||(parNiv[c.niveau]={eff:0,mgs:[]});p.eff+=r.rows.length;r.rows.forEach(x=>{if(x.mg!=null)p.mgs.push(x.mg)})}
  const seuil=settingsOf(etabId).seuil;const F=ins.filter(i=>get('eleves',i.eleve_id)?.sexe==='F').length;
  return{eff:ins.length,F,M:ins.length-F,classes:cls.length,moy:mgs.length?r2(mean(mgs)):null,taux:mgs.length?Math.round(mgs.filter(x=>x>=seuil).length/mgs.length*100):null,miss,nonVal,parNiv,ens:all('utilisateurs').filter(u=>u.role==='enseignant'&&u.etab_id===etabId&&u.actif).length}
}

  const pd=settingsOf(i.etab),an=get('annees',i.annee),y0=+(an?.libelle||'2026').slice(0,4);let cum=0,exig=0;pd.tranches.forEach((pc,k)=>{cum+=pc;const[mm,dd]=(pd.echeances[k]||'12-31').split('-');const dt=`${(+mm>=9)?y0:y0+1}-${mm}-${dd}`;if(dt<=today())exig=cum});const exigible=Math.round(due*exig/100);return{due,paid,solde:due-paid,exigible,arriere:Math.max(0,exigible-paid)}}
const activeInscEA=()=>rowsEA('inscriptions').filter(i=>['inscrit','reintegre'].includes(i.statut));
const teachersE=()=>all('utilisateurs').filter(u=>u.role==='enseignant'&&u.etab_id===S.etab&&u.actif);

  if(['superadmin','deps','drenaet','fondateur'].includes(r))h+=dashMulti();else if(r==='directeur')h+=dashDir();else if(r==='enseignant')h+=dashEns();else if(r==='intendant')h+=dashInt();else if(r==='bibliothecaire')h+=dashBib();else if(r==='archiviste')h+=dashArc();else h+=dashSec();return h}};
function dashMulti(){const E=[...S.scope].map(etabOf).filter(Boolean);const st=E.map(e=>({e,s:statEtab(e.id,1)}));const eff=sum(st.map(x=>x.s.eff)),mgs=st.map(x=>x.s.moy).filter(x=>x!=null);
  let h=`<div class="kpis">${kpi(E.length,'Établissements dans votre périmètre')}${kpi(eff,'Élèves inscrits','g')}${kpi(sum(st.map(x=>x.s.ens)),'Enseignants actifs')}${kpi(mgs.length?fmtN(mean(mgs)):'—','Moyenne générale T1 (résultats validés)','w')}</div>`;
  if(can('finances','L')){const ins=all('inscriptions').filter(i=>S.scope.has(i.etab)&&i.annee===S.annee&&['inscrit','reintegre'].includes(i.statut));const pa=sum(all('paiements').filter(p=>S.scope.has(p.etab)&&p.annee===S.annee).map(p=>p.montant));const ar=sum(ins.map(i=>finEleve(i).arriere));h+=`<div class="kpis">${kpi(fmtM(pa),'Recettes de scolarité encaissées','g')}${kpi(fmtM(ar),'Arriérés exigibles','r')}</div>`}
  h+=`<div class="cols"><div class="card"><h3>Effectifs par établissement</h3>${hbars(st.map(x=>({l:x.e.nom,v:x.s.eff})),{fmt:x=>x})}</div><div class="card"><h3>Moyenne générale T1 par établissement</h3>${hbars(st.map(x=>({l:x.e.nom,v:x.s.moy})),{max:20})}</div></div>
  <div class="card"><h3>Synthèse par établissement</h3>${tbl(['Établissement','DRENAET','Élèves (F/G)','Classes','Moyenne T1','Réussite ≥ seuil','Notes manquantes','Évaluations non validées'],st.map(x=>[`<b>${esc(x.e.nom)}</b><div class="muted small">${esc(x.e.code)}</div>`,esc(get('drenaet',x.e.drenaet_id)?.nom||''),`${x.s.eff} (${x.s.F}/${x.s.M})`,x.s.classes,fmtN(x.s.moy),x.s.taux==null?'—':x.s.taux+' %',x.s.miss?badge(x.s.miss,'warn'):badge('0','ok'),x.s.nonVal?badge(x.s.nonVal,'warn'):badge('0','ok')]))}</div>`;
  return h}
function dashDir(){const cls=rowsEA('classes');const ev=rowsEA('evaluations');const soum=ev.filter(e=>e.statut==='soumis'),brou=ev.filter(e=>e.statut==='brouillon');const st=statEtab(S.etab,1);const ins=activeInscEA();const ar=sum(ins.map(i=>finEleve(i).arriere));

function dashEns(){const my=myClasses();const aff=all('affectations').filter(a=>a.ens_id===S.user.id&&a.annee===S.annee);const ev=rowsEA('evaluations').filter(e=>e.auteur===S.user.login);

function dashInt(){const ins=activeInscEA();const pa=sum(rowsEA('paiements').map(p=>p.montant));const dep=sum(rowsEA('depenses').map(p=>p.montant));const rec=sum(rowsEA('recettes').map(p=>p.montant));const ar=sum(ins.map(i=>finEleve(i).arriere));const due=sum(ins.map(i=>finEleve(i).due));

MODS.stats={render(){const f=S.q.st||(S.q.st={reg:'',dr:'',et:'',cy:'',nv:'',tr:'1'});const E=scopeEtabs(S.user).map(etabOf).filter(Boolean);S.scope=new Set(E.map(e=>e.id));
  const regs=[...new Set(E.map(e=>e.region_id))].map(id=>[id,get('regions',id)?.nom]);const drs=[...new Set(E.map(e=>e.drenaet_id))].map(id=>[id,get('drenaet',id)?.nom]);
  if(f.reg&&!regs.some(r=>r[0]===f.reg))f.reg='';if(f.dr&&!drs.some(r=>r[0]===f.dr))f.dr='';if(f.et&&!E.some(e=>e.id===f.et))f.et='';const cyc=[...new Set(E.flatMap(e=>e.cycles))];const nivs=NIV.filter(n=>cyc.includes(n.cycle));if(f.cy&&!cyc.includes(+f.cy))f.cy='';if(f.nv&&!nivs.some(n=>n.id===f.nv))f.nv='';
  let sel=E.filter(e=>(!f.reg||e.region_id===f.reg)&&(!f.dr||e.drenaet_id===f.dr)&&(!f.et||e.id===f.et));const trim=+f.tr;const lines=[];
  for(const e of sel){const s=statEtab(e.id,trim);for(const[n,v]of Object.entries(s.parNiv)){const nv=NIV.find(x=>x.id===n);if(f.cy&&String(nv.cycle)!==f.cy)continue;if(f.nv&&f.nv!==n)continue;const seuil=settingsOf(e.id).seuil;lines.push([e.nom,get('drenaet',e.drenaet_id)?.nom||'',nv.cycle===1?'1er cycle':'2nd cycle',nv.nom,v.eff,v.mgs.length?fmtN(mean(v.mgs)):'—',v.mgs.length?Math.round(v.mgs.filter(x=>x>=seuil).length/v.mgs.length*100)+' %':'—'])}}
  S._stLines=lines;const tot=sum(lines.map(l=>l[4]));const heads=['Établissement','DRENAET','Cycle','Niveau','Effectif','Moyenne','Réussite'];
  return pageHead('Statistiques',`Résultats issus des évaluations <b>validées</b> uniquement`,can('stats','X')?btn('Excel','stx','','ghost')+btn('Word','std','','ghost')+btn('Imprimer / PDF','stp','','ghost'):'')+
  `<div class="card"><div class="bar">${regs.length>1?`<div><label>Région</label><select data-chg="stf" data-k="reg"><option value="">Toutes</option>${selOpts(regs,f.reg)}</select></div>`:''}${drs.length>1?`<div><label>DRENAET</label><select data-chg="stf" data-k="dr"><option value="">Toutes</option>${selOpts(drs,f.dr)}</select></div>`:''}${E.length>1?`<div><label>Établissement</label><select data-chg="stf" data-k="et"><option value="">Tous</option>${selOpts(E.map(e=>[e.id,e.nom]),f.et)}</select></div>`:`<div><label>Établissement</label><b>${esc(E[0]?.nom||'')}</b></div>`}${cyc.length>1?`<div><label>Cycle</label><select data-chg="stf" data-k="cy"><option value="">Tous</option>${cyc.includes(1)?`<option value="1" ${f.cy==='1'?'selected':''}>1er cycle</option>`:''}${cyc.includes(2)?`<option value="2" ${f.cy==='2'?'selected':''}>2nd cycle</option>`:''}</select></div>`:''}<div><label>Niveau</label><select data-chg="stf" data-k="nv"><option value="">Tous</option>${selOpts(nivs.map(n=>[n.id,n.nom]),f.nv)}</select></div><div><label>Trimestre</label><select data-chg="stf" data-k="tr">${selOpts([[1,'1er trimestre'],[2,'2ème trimestre'],[3,'3ème trimestre']],f.tr)}</select></div></div>
  <div class="kpis"><div class="kpi">${kpi(tot,'Effectif concerné','g')}</div></div>${tbl(heads,lines)}</div><div class="card"><h3>Effectifs par niveau</h3>${hbars(nivs.map(n=>({l:n.nom,v:sum(lines.filter(l=>l[3]===n.nom).map(l=>l[4]))})),{fmt:x=>x})}</div>`;}};

function classForm(c){need('classes',c?'M':'C');const E=etabOf(S.etab);const niv=NIV.filter(n=>E.cycles.includes(n.cycle));openForm({title:c?'Modifier la classe':'Nouvelle classe',fields:[{k:'niveau',label:'Niveau',type:'select',opts:niv.map(n=>[n.id,n.nom]),v:c?.niveau,ro:!!c},{k:'suffixe',label:'Division (A, B…)',req:1,v:c?c.nom.split(' ').pop():'A'},{k:'capacite',label:'Capacité',type:'number',v:c?.capacite||50,min:1},{k:'salle',label:'Salle',v:c?.salle},{k:'pp_id',label:'Professeur principal',type:'select',opts:[['','— aucun —'],...teachersE().map(t=>[t.id,t.nom])],v:c?.pp_id||''}],
  onSave:f=>{const nm=nivNom(f.niveau)+' '+f.suffixe.trim().toUpperCase();if(rowsEA('classes').some(x=>x.nom===nm&&x.id!==c?.id))throw new Error('Cette classe existe déjà cette année');save('classes',{...(c||{etab:S.etab,annee:S.annee}),niveau:c?c.niveau:f.niveau,nom:nm,capacite:f.capacite,salle:f.salle,pp_id:f.pp_id||null})}})}
ACT.clNew=()=>classForm();ACT.clEdit=el=>classForm(get('classes',el.dataset.id));
ACT.clDel=async el=>{need('classes','M');const c=get('classes',el.dataset.id);if(activeInsc(c.id).length)throw new Error('Impossible : la classe contient des élèves inscrits');if(await askConfirm('Supprimer (suppression logique) la classe '+c.nom+' ?',{danger:true})){del('classes',c.id,'suppression classe');render()}};
/* ---------- Élèves ---------- */
function elRows(){const f=S.q.el||(S.q.el={q:'',classe:''});const ok=new Set(myClasses().map(c=>c.id));const q=f.q.toLowerCase();
  return rowsEA('inscriptions').filter(i=>i.statut!=='annulee'&&ok.has(i.classe_id)&&(!f.classe||i.classe_id===f.classe)).map(i=>({i,e:get('eleves',i.eleve_id),c:get('classes',i.classe_id)})).filter(x=>x.e&&(!q||(eleveName(x.e)+' '+x.e.matricule).toLowerCase().includes(q))).sort((a,b)=>a.c.nom.localeCompare(b.c.nom)||eleveName(a.e).localeCompare(eleveName(b.e)))}
function elTable(){const lim=['enseignant'].includes(S.user.role);const stB={inscrit:['Inscrit','ok'],reintegre:['Réintégré','ok'],transfere:['Changement de classe','mut'],sorti:['Sorti','bad']};
  return tbl(['Matricule','Nom et prénoms','Sexe','Naissance','Classe','Statut','Pièces',''],elRows().map(({i,e,c})=>{const p=e.pieces||{};const np=[p.acte_naissance,p.certificat,p.photos].filter(Boolean).length;return[esc(e.matricule),`<b>${esc(e.nom)}</b> ${esc(e.prenoms)}`,esc(e.sexe),fmtDate(e.naissance),esc(c.nom),badge(...stB[i.statut]||[i.statut]),np===3?badge('Complet','ok'):badge(np+'/3','warn'),btn('Fiche','elFiche',i.id,'ghost')+(can('eleves','M')&&!lim?(['inscrit','reintegre'].includes(i.statut)?btn('Modifier','elEdit',i.id,'ghost')+btn('Classe','elMove',i.id,'ghost')+btn('Sortie','elOut',i.id,'ghost'):i.statut==='sorti'?btn('Réintégrer','elBack',i.id,'ghost'):''):'')]}))}
MODS.eleves={render(){const f=S.q.el||(S.q.el={q:'',classe:''});const cl=myClasses();
  return pageHead('Élèves',curEtabHead(),(can('eleves','C')?btn('+ Nouvelle inscription','elNew')+btn('Réinscrire','elRe','','ghost'):'')+(can('eleves','X')?btn('Exporter Excel','elx','','ghost'):''))+`<div class="card"><div class="bar"><div style="flex:1"><label>Recherche</label><input data-inp="elq" placeholder="Nom ou matricule" value="${esc(f.q)}"></div><div><label>Classe</label><select data-chg="elc"><option value="">Toutes</option>${selOpts(cl.map(c=>[c.id,c.nom]),f.classe)}</select></div></div><div id="elT">${elTable()}</div></div>`}};
ACT.inp_elq=el=>{S.q.el.q=el.value;$('#elT').innerHTML=elTable()};ACT.chg_elc=el=>{S.q.el.classe=el.value;$('#elT').innerHTML=elTable()};
ACT.elx=()=>{need('eleves','X');exportXLS('eleves','Liste des élèves — '+(etabOf(S.etab).nom),['Matricule','Nom','Prénoms','Sexe','Naissance','Classe','Statut','Responsable','Contact'],elRows().map(({i,e,c})=>[e.matricule,e.nom,e.prenoms,e.sexe,fmtDate(e.naissance),c.nom,i.statut,e.resp,e.tel_resp]))};
const piecesF=e=>[{k:'p1',label:'Pièces administratives',type:'checkbox',cb:'Extrait d\'acte de naissance',v:e?.pieces?.acte_naissance},{k:'p2',label:' ',type:'checkbox',cb:'Certificat de scolarité / bulletin précédent',v:e?.pieces?.certificat},{k:'p3',label:' ',type:'checkbox',cb:'Photos d\'identité',v:e?.pieces?.photos}];
function newMatricule(){const n=all('eleves').filter(e=>e.etab===S.etab).length+1;return'MAT'+(S.etab||'').slice(0,4).toUpperCase().replace(/-/g,'')+String(n).padStart(5,'0')}
function eleveForm(ins){need('eleves',ins?'M':'C');const e=ins?get('eleves',ins.eleve_id):null;const cls=rowsEA('classes');
  openForm({title:e?'Modifier le dossier élève':'Nouvelle inscription',wide:true,fields:[{k:'matricule',label:'Matricule',v:e?.matricule||newMatricule(),help:'Unique ; généré automatiquement'},{k:'nom',label:'Nom',req:1,v:e?.nom},{k:'prenoms',label:'Prénoms',req:1,v:e?.prenoms},{k:'sexe',label:'Sexe',type:'select',opts:[['F','Féminin'],['M','Masculin']],v:e?.sexe},{k:'naissance',label:'Date de naissance',type:'date',req:1,v:e?.naissance},{k:'origine',label:'Établissement d\'origine',v:e?.origine},{k:'resp',label:'Responsable légal',v:e?.resp},{k:'tel_resp',label:'Contact du responsable',v:e?.tel_resp},...(e?[]:[{k:'classe_id',label:'Classe',type:'select',opts:cls.map(c=>[c.id,c.nom+' ('+activeInsc(c.id).length+'/'+c.capacite+')']),req:1}]),...piecesF(e)],
  onSave:f=>{if(all('eleves').some(x=>x.matricule===f.matricule&&x.id!==e?.id))throw new Error('Ce matricule existe déjà');const el=save('eleves',{...(e||{etab:S.etab}),matricule:f.matricule,nom:f.nom.toUpperCase(),prenoms:f.prenoms,sexe:f.sexe,naissance:f.naissance,origine:f.origine,resp:f.resp,tel_resp:f.tel_resp,pieces:{acte_naissance:f.p1,certificat:f.p2,photos:f.p3}});
    if(!e){const c=get('classes',f.classe_id);if(activeInsc(c.id).length>=c.capacite)throw new Error('Classe complète ('+c.capacite+' places)');save('inscriptions',{etab:S.etab,annee:S.annee,eleve_id:el.id,classe_id:c.id,statut:'inscrit',date:today(),source:'inscription'});audit('inscription','eleves',eleveName(el)+' → '+c.nom)}}})}
ACT.elNew=()=>eleveForm();ACT.elEdit=el=>eleveForm(get('inscriptions',el.dataset.id));
ACT.elRe=()=>{need('eleves','C');const has=new Set(rowsEA('inscriptions').filter(i=>i.statut!=='annulee').map(i=>i.eleve_id));const cand=rowsE('eleves').filter(e=>!has.has(e.id));if(!cand.length){toast('Aucun ancien élève à réinscrire','err');return}
  openForm({title:'Réinscription (nouvelle année scolaire)',fields:[{k:'eleve_id',label:'Ancien élève',type:'select',opts:cand.map(e=>[e.id,eleveName(e)+' — '+e.matricule]),req:1},{k:'classe_id',label:'Classe',type:'select',opts:rowsEA('classes').map(c=>[c.id,c.nom]),req:1}],onSave:f=>{const c=get('classes',f.classe_id);if(activeInsc(c.id).length>=c.capacite)throw new Error('Classe complète');save('inscriptions',{etab:S.etab,annee:S.annee,eleve_id:f.eleve_id,classe_id:c.id,statut:'inscrit',date:today(),source:'réinscription'});audit('réinscription','eleves',f.eleve_id)}})};
ACT.elMove=el=>{need('eleves','M');const i=get('inscriptions',el.dataset.id);openForm({title:'Changement de classe',note:'L\'ancienne inscription est conservée (avec ses notes) ; une nouvelle inscription est créée dans la classe de destination.',fields:[{k:'classe_id',label:'Nouvelle classe',type:'select',opts:rowsEA('classes').filter(c=>c.id!==i.classe_id).map(c=>[c.id,c.nom]),req:1}],onSave:f=>{const c=get('classes',f.classe_id);if(activeInsc(c.id).length>=c.capacite)throw new Error('Classe complète');i.statut='transfere';i.date_fin=today();save('inscriptions',i);save('inscriptions',{etab:S.etab,annee:S.annee,eleve_id:i.eleve_id,classe_id:c.id,statut:'inscrit',date:today(),source:'changement_classe',depuis:i.id});audit('changement de classe','eleves',i.eleve_id+' → '+c.nom)}})};
ACT.elOut=el=>{need('eleves','M');const i=get('inscriptions',el.dataset.id);openForm({title:'Sortie / transfert de l\'élève',fields:[{k:'motif',label:'Motif',type:'select',opts:['Transfert vers un autre établissement','Abandon','Exclusion','Décès','Autre'],req:1},{k:'prec',label:'Précision'}],onSave:f=>{i.statut='sorti';i.motif=f.motif+(f.prec?' — '+f.prec:'');i.date_fin=today();save('inscriptions',i);audit('sortie élève','eleves',i.eleve_id+' : '+i.motif)}})};
ACT.elBack=async el=>{need('eleves','M');const i=get('inscriptions',el.dataset.id);if(await askConfirm('Réintégrer cet élève dans sa classe ?')){const c=get('classes',i.classe_id);if(activeInsc(c.id).length>=c.capacite)throw new Error('Classe complète');i.statut='reintegre';save('inscriptions',i);audit('réintégration','eleves',i.eleve_id);render()}};
ACT.elFiche=el=>{const i=get('inscriptions',el.dataset.id);const e=get('eleves',i.eleve_id);const hist=all('inscriptions').filter(x=>x.eleve_id===e.id&&x.statut!=='annulee').sort((a,b)=>anneeLib(b.annee).localeCompare(anneeLib(a.annee)));const lim=S.user.role==='enseignant';
  const fin=can('finances','L')?finEleve(i):null;const p=e.pieces||{};
  openModal(`<div style="display:flex;gap:16px;align-items:flex-start"><div>${e.photo?`<img src="${e.photo}" style="width:96px;height:120px;object-fit:cover;border-radius:8px;border:1px solid var(--bd)">`:`<div style="width:96px;height:120px;border-radius:8px;background:#edf2ef;display:grid;place-items:center;font-size:34px">🎓</div>`}${can('eleves','M')&&!lim?`<input type="file" accept="image/*" data-chg="photo" data-id="${i.id}" style="font-size:11px;margin-top:6px;width:96px">`:''}</div>
  <div style="flex:1"><h3>${esc(eleveName(e))}</h3><div class="muted">Matricule <b>${esc(e.matricule)}</b> • ${esc(e.sexe==='F'?'Féminin':'Masculin')} • né(e) le ${fmtDate(e.naissance)}</div>${lim?'':`<div style="margin-top:6px">Responsable : ${esc(e.resp||'—')} • ${esc(e.tel_resp||'—')}</div><div>Établissement d'origine : ${esc(e.origine||'—')}</div>`}<div style="margin-top:6px">Pièces : ${badge('Acte de naissance',p.acte_naissance?'ok':'bad')} ${badge('Certificat',p.certificat?'ok':'bad')} ${badge('Photos',p.photos?'ok':'bad')}</div>
  ${fin?`<div style="margin-top:6px">Scolarité : dû ${fmtM(fin.due)} • payé ${fmtM(fin.paid)} • solde ${fin.solde>0?`<b class="low">${fmtM(fin.solde)}</b>`:badge('Soldé','ok')}</div>`:''}</div></div>
  <h4 style="margin-top:14px">Parcours scolaire</h4>${tbl(['Année','Classe','Statut','Source','Décision annuelle'],hist.map(x=>[esc(anneeLib(x.annee)),esc(get('classes',x.classe_id)?.nom||''),esc(x.statut),esc(x.source||''),esc(all('decisions').find(d=>d.inscription_id===x.id&&d.periode==='annuel'&&d.statut!=='annule')?.decision||'—')]))}<div class="mfoot"><button class="btn ghost" data-act="closeModal">Fermer</button></div>`,{wide:true})};
ACT.chg_photo=el=>{const f=el.files[0];if(!f)return;const i=get('inscriptions',el.dataset.id);const img=new Image();const fr=new FileReader();fr.onload=()=>{img.onload=()=>{const c=document.createElement('canvas');c.width=120;c.height=150;const x=c.getContext('2d');const sc=Math.max(120/img.width,150/img.height);x.drawImage(img,(120-img.width*sc)/2,(150-img.height*sc)/2,img.width*sc,img.height*sc);const e=get('eleves',i.eleve_id);e.photo=c.toDataURL('image/jpeg',.7);save('eleves',e);toast('Photo enregistrée','ok');ACT.elFiche({dataset:{id:i.id}})};img.src=fr.result};fr.readAsDataURL(f)};

MODS.enseignants={render(){const T=teachersE();const aff=rowsEA('affectations');return pageHead('Enseignants & affectations',curEtabHead(),can('enseignants','C')?btn('+ Nouvelle affectation','afNew'):'')+tbl(['Enseignant','Identifiant','Matières','Classes / matières affectées','Prof. principal de'],T.map(t=>{const a=aff.filter(x=>x.ens_id===t.id);const pp=rowsEA('classes').filter(c=>c.pp_id===t.id).map(c=>c.nom);return[`<b>${esc(t.nom)}</b>`,`<code>${esc(t.login)}</code>`,esc((t.matieres||[]).map(matNom).join(', ')),a.map(x=>`<span class="badge">${esc(get('classes',x.classe_id)?.nom||'')} · ${esc(matNom(x.matiere))}</span>${can('enseignants','M')?`<a href="#" data-act="afDel" data-id="${x.id}" title="Retirer" style="text-decoration:none"> ✕ </a>`:''}`).join(' ')||'<span class="muted">—</span>',esc(pp.join(', ')||'—')]}))}};
ACT.afNew=()=>{need('enseignants','C');openForm({title:'Nouvelle affectation',fields:[{k:'ens_id',label:'Enseignant',type:'select',opts:teachersE().map(t=>[t.id,t.nom]),req:1},{k:'classe_id',label:'Classe',type:'select',opts:rowsEA('classes').map(c=>[c.id,c.nom]),req:1},{k:'matiere',label:'Matière',type:'select',opts:MATIERES.map(m=>[m[0],m[1]]),req:1}],onSave:f=>{const c=get('classes',f.classe_id);if(!coefsOf(c).some(m=>m.code===f.matiere))throw new Error('Matière non enseignée à ce niveau (voir Paramétrage pédagogique)');if(rowsEA('affectations').some(a=>a.classe_id===f.classe_id&&a.matiere===f.matiere))throw new Error('Cette matière est déjà affectée dans cette classe');save('affectations',{etab:S.etab,annee:S.annee,...f})}})};

const CRENEAUX=['07:30-08:30','08:30-09:30','09:45-10:45','10:45-11:45','15:00-16:00','16:00-17:00'],JOURS=['Lundi','Mardi','Mercredi','Jeudi','Vendredi','Samedi'];
MODS.vie={render(){const t=S.q.vie||'cahier';const cl=myClasses();const c=S.q.vieC&&cl.some(x=>x.id===S.q.vieC)?S.q.vieC:cl[0]?.id;S.q.vieC=c;
  let h=pageHead('Vie scolaire',curEtabHead())+`<div class="tabs">${[['cahier','Cahier de textes'],['abs','Absences & retards'],['edt','Emploi du temps']].map(([k,l])=>`<button class="tab ${t===k?'on':''}" data-act="vieTab" data-id="${k}">${l}</button>`).join('')}</div><div class="bar"><div><label>Classe</label><select data-chg="vieC">${selOpts(cl.map(x=>[x.id,x.nom]),c)}</select></div></div>`;
  if(!c)return h+alertBox('Aucune classe disponible.','w');
  if(t==='cahier')h+=(can('vie','C')?`<div style="margin-bottom:10px">${btn('+ Séance','cahNew')}</div>`:'')+tbl(['Date','Matière','Contenu de la séance','Devoir / leçon à préparer','Auteur'],rowsEA('cahier').filter(x=>x.classe_id===c).sort((a,b)=>b.date.localeCompare(a.date)).map(x=>[fmtDate(x.date),esc(matNom(x.matiere)),esc(x.contenu),esc(x.devoir||'—'),esc(x.auteur||'')]));
  if(t==='abs'){const ab=rowsEA('absences').filter(x=>x.classe_id===c);h+=(can('vie','C')?`<div style="margin-bottom:10px">${btn('+ Absence / retard','absNew')}</div>`:'')+tbl(['Date','Élève','Type','Durée','Justifiée','Motif'],ab.sort((a,b)=>b.date.localeCompare(a.date)).map(x=>[fmtDate(x.date),esc(eleveName(get('eleves',get('inscriptions',x.inscription_id)?.eleve_id))),badge(x.type,x.type==='Absence'?'bad':'warn'),esc(x.duree||''),x.justifiee?badge('Oui','ok'):badge('Non','mut'),esc(x.motif||'')]))}
  if(t==='edt'){const E=rowsEA('edt').filter(x=>x.classe_id===c);h+=`<div class="tw"><table><thead><tr><th>Créneau</th>${JOURS.map(j=>`<th>${j}</th>`).join('')}</tr></thead><tbody>${CRENEAUX.map(cr=>`<tr><td class="nowrap"><b>${cr}</b></td>${JOURS.map(j=>{const x=E.find(e=>e.jour===j&&e.creneau===cr);return`<td ${can('vie','M')?`data-act="edtCell" data-id="${j}|${cr}" style="cursor:pointer"`:''}>${x?`<b>${esc(matNom(x.matiere))}</b><div class="muted small">${esc(x.salle||'')}</div>`:'<span class="muted">·</span>'}</td>`}).join('')}</tr>`).join('')}</tbody></table></div>`}
  return h}};

ACT.cahNew=()=>{need('vie','C');const c=get('classes',S.q.vieC);const ms=S.user.role==='enseignant'?all('affectations').filter(a=>a.ens_id===S.user.id&&a.classe_id===c.id).map(a=>a.matiere):coefsOf(c).map(m=>m.code);if(!ms.length)throw new Error('Aucune matière affectée dans cette classe');openForm({title:'Séance — '+c.nom,fields:[{k:'date',label:'Date',type:'date',v:today(),req:1},{k:'matiere',label:'Matière',type:'select',opts:ms.map(m=>[m,matNom(m)])},{k:'contenu',label:'Contenu de la séance',type:'textarea',req:1,full:1},{k:'devoir',label:'Devoir / leçon',type:'textarea',full:1}],onSave:f=>save('cahier',{etab:S.etab,annee:S.annee,classe_id:c.id,...f,auteur:S.user.login})})};
ACT.absNew=()=>{need('vie','C');const c=S.q.vieC;openForm({title:'Absence / retard',fields:[{k:'inscription_id',label:'Élève',type:'select',opts:activeInsc(c).map(i=>[i.id,eleveName(get('eleves',i.eleve_id))]),req:1},{k:'date',label:'Date',type:'date',v:today(),req:1},{k:'type',label:'Type',type:'select',opts:['Absence','Retard']},{k:'duree',label:'Durée',ph:'ex. 2 h, 10 min'},{k:'justifiee',label:'Justification',type:'checkbox',cb:'Absence justifiée'},{k:'motif',label:'Motif',full:1}],onSave:f=>save('absences',{etab:S.etab,annee:S.annee,classe_id:c,...f})})};
ACT.edtCell=el=>{need('vie','M');const[j,cr]=el.dataset.id.split('|');const c=get('classes',S.q.vieC);const ex=rowsEA('edt').find(e=>e.classe_id===c.id&&e.jour===j&&e.creneau===cr);openForm({title:`${j} ${cr} — ${c.nom}`,fields:[{k:'matiere',label:'Matière',type:'select',opts:[['','— libre —'],...coefsOf(c).map(m=>[m.code,m.nom])],v:ex?.matiere||''},{k:'salle',label:'Salle',v:ex?.salle||c.salle}],onSave:f=>{if(!f.matiere){if(ex)del('edt',ex.id);return}save('edt',{...(ex||{etab:S.etab,annee:S.annee,classe_id:c.id,jour:j,creneau:cr}),matiere:f.matiere,salle:f.salle})}})};

MODS.params={render(){const t=S.q.pa||'gen';const E=etabOf(S.etab);const p=curP();const ed=can('params','M');
  let h=pageHead('Paramétrage pédagogique',curEtabHead())+alertBox('Les barèmes, coefficients et formules ci-dessous sont des <b>valeurs d\'exemple</b> : les règles officielles par niveau doivent être validées par les responsables pédagogiques avant mise en production (CDC §7.1 et §16).','w')+`<div class="tabs">${[['gen','Règles de calcul & accès'],['mat','Matières & coefficients'],['an','Années scolaires']].map(([k,l])=>`<button class="tab ${t===k?'on':''}" data-act="paTab" data-id="${k}">${l}</button>`).join('')}</div>`;

function discFields(u){const ms=MATIERES.map(([code,nom])=>({code,nom}));const cur=u?.discipline||'';const kn=ms.find(m=>discLabel(m.code,m.nom)===cur);

  onSave:async f=>{const l=f.login.trim().toLowerCase();if(!/^[a-z0-9._-]{3,}$/.test(l))throw new Error('Identifiant invalide (3 caractères minimum, sans espace)');if(all('utilisateurs').some(u=>u.login===l))throw new Error('Identifiant déjà utilisé');const e=pwPolicy(f.pw);if(e)throw new Error(e);

function ntState(){const cl=myClasses();const s=S.q.nt||(S.q.nt={classe:'',mat:'',trim:1});if(!cl.some(c=>c.id===s.classe))s.classe=cl[0]?.id||'';const c=get('classes',s.classe);

  `<div class="card"><div class="bar"><div><label>Classe</label><select data-chg="ntC">${selOpts(cl.map(x=>[x.id,x.nom]),s.classe)}</select></div><div><label>Matière</label><select data-chg="ntM">${S.user.role==='enseignant'?'':'<option value="">Toutes</option>'}${selOpts(mats.map(m=>[m,matNom(m)]),s.mat)}</select></div><div><label>Trimestre</label><select data-chg="ntT">${selOpts(trimOpts,s.trim)}</select></div><div class="grow"></div>${can('notes','C')&&c&&s.mat?`<div>${btn('+ Nouvelle évaluation','evNew')}</div>`:''}</div>`;

  h+=tbl(['Matière','Évaluation','Type','Date','Barème','Saisies','Statut',''],evs.map(e=>{const n=activeInsc(c.id).filter(i=>{const x=nm[e.id+'|'+i.id];return x&&!(x.etat==='note'&&x.valeur==null)}).length;const own=can('notes','M')&&isAffected(c.id,e.matiere);const st=stEval[e.statut];
    return[esc(matNom(e.matiere)),esc(e.titre),esc(e.type),fmtDate(e.date),'/'+e.bareme,`${n} / ${nI} ${n<nI?badge('incomplet','warn'):''}`,badge(st[0],st[1]),btn(own&&e.statut==='brouillon'?'Saisir':'Consulter','ntSaisie',e.id,'ghost')+(own&&e.statut==='brouillon'?btn('Soumettre','ntSubmit',e.id,'')+btn('Supprimer','evDel',e.id,'ghost'):'')+(can('notes','V')&&e.statut==='soumis'?btn('Valider','ntValid',e.id,'ok')+btn('Retourner','ntBack',e.id,'ghost'):'')+(can('notes','V')&&e.statut==='valide'?btn('Rouvrir','ntBack',e.id,'ghost'):'')]}));

function collectNotes(ev){const bad=[];const out=[];for(const inp of $$('[data-n]')){const raw=inp.value.trim().replace(',','.');inp.style.outline='';let etat='note',valeur=null;if(raw==='')etat='vide';else if(/^(a|abs)$/i.test(raw))etat='absent';else if(/^(d|disp)$/i.test(raw))etat='dispense';else{const x=Number(raw);if(isNaN(x)||x<0||x>ev.bareme){bad.push(inp);inp.style.outline='2px solid #c4372d';continue}valeur=x}out.push({insc:inp.dataset.n,etat,valeur})}
  if(bad.length)throw new Error(bad.length+' valeur(s) invalide(s) : une note doit être comprise entre 0 et '+ev.bareme+' (ou A / D)');return out}
function applyNotes(ev,list){const ex={};for(const n of all('notes'))if(n.evaluation_id===ev.id)ex[n.inscription_id]=n;let ch=0;for(const x of list){const o=ex[x.insc];if(x.etat==='vide'){if(o){del('notes',o.id);ch++}continue}if(o&&o.etat===x.etat&&o.valeur===x.valeur)continue;save('notes',{...(o||{etab:ev.etab,evaluation_id:ev.id,inscription_id:x.insc}),etat:x.etat,valeur:x.valeur});ch++}return ch}
ACT.ntSaveDraft=el=>{const ev=get('evaluations',el.dataset.id);need('notes','M');if(ev.statut!=='brouillon')throw new Error('Évaluation verrouillée');const n=applyNotes(ev,collectNotes(ev));audit('saisie notes','notes',ev.titre+' ('+n+' modif.)');toast(n?n+' note(s) enregistrée(s)'+(isOnline()?'':' (en attente de synchronisation)'):'Aucune modification','ok');closeModal();render()};
ACT.ntSaveSubmit=async el=>{const ev=get('evaluations',el.dataset.id);need('notes','M');const list=collectNotes(ev);const vide=list.filter(x=>x.etat==='vide').length;if(vide&&!await askConfirm(vide+' note(s) non saisie(s). Soumettre quand même à la direction ?'))return;applyNotes(ev,list);submitEval(ev);closeModal();render()};
function submitEval(ev){if(ev.statut!=='brouillon')return;ev.statut='soumis';ev.soumis_le=nowISO();save('evaluations',ev);audit('soumission évaluation','notes',ev.titre);notify('Évaluation soumise',`${ev.titre} — ${matNom(ev.matiere)} (${get('classes',ev.classe_id)?.nom}) est en attente de validation.`,{roles:['directeur'],etab:ev.etab});toast('Évaluation soumise à la direction','ok')}

  ${miss.length?`<h4 style="margin-top:14px">Notes manquantes à régulariser</h4>${tbl(['Élève','Matière','Évaluation','Statut'],miss.slice(0,40).map(m=>m.map(esc)))}`:''}

  <p class="muted small">Le professeur principal consolide et propose ; il ne peut pas modifier les notes de ses collègues. Les appréciations sont des propositions soumises au conseil de classe.</p></div>`;return h}};

const anneeSuivante=id=>{const a=get('annees',id);if(!a)return null;const y=+a.libelle.slice(0,4)+1;return all('annees').find(x=>x.libelle===y+'-'+(y+1))||null};
const decOf=inscId=>all('decisions').find(d=>d.inscription_id===inscId&&d.periode==='annuel'&&d.statut!=='annule');
function planPromotion(classeId){const cl=get('classes',classeId);const et=etabOf(cl.etab);const nv=NIV.find(n=>n.id===cl.niveau);
  return activeInsc(classeId).map(i=>{const d=decOf(i.id);const done=all('promotions').find(p=>p.decision_id===d?.id&&p.statut==='effectuee');let act='none',niv=null,why='';
    if(!d)why='Pas de décision';else if(d.statut!=='valide')why='Décision non validée par la direction';else if(done)why='Promotion déjà effectuée';
    else if(d.decision==='Admis'){if(!nv.next)why='Fin de cycle (Terminale) — sortie';else{const nx=NIV.find(n=>n.id===nv.next);if(!et.cycles.includes(nx.cycle))why='Cycle '+nx.cycle+' non autorisé dans l\'établissement — affectation externe';else{act='promote';niv=nx.id}}}
    else if(d.decision==='Redoublant'){act='redouble';niv=cl.niveau}else why='« '+d.decision+' » : traitement manuel';
    return{insc:i,d,act,niv,why,done}})}
function findOrCreateClass(etab,annee,niveau,model){const cs=all('classes').filter(c=>c.etab===etab&&c.annee===annee&&c.niveau===niveau).sort((a,b)=>a.nom.localeCompare(b.nom));const free=cs.find(c=>activeInsc(c.id).length<c.capacite);if(free)return free;const letter=String.fromCharCode(65+cs.length);return save('classes',{etab,annee,niveau,nom:nivNom(niveau)+' '+letter,capacite:model.capacite,salle:'',pp_id:null})}
function ensureCoefs(etab,annee,niveau,fromAnnee){if(all('coefficients').some(x=>x.etab===etab&&x.annee===annee&&x.niveau===niveau))return;for(const x of all('coefficients').filter(x=>x.etab===etab&&x.annee===fromAnnee&&x.niveau===niveau))save('coefficients',{etab,annee,niveau,matiere:x.matiere,coef:x.coef})}
MODS.conseils={render(){const cl=rowsEA('classes').filter(c=>S.user.role!=='enseignant'||myPPClasses().some(p=>p.id===c.id));const s=S.q.cc||(S.q.cc={classe:'',per:'annuel'});if(!cl.some(c=>c.id===s.classe))s.classe=cl[0]?.id||'';if(!s.classe)return pageHead('Conseils de classe')+alertBox('Aucune classe.','w');
  const c=get('classes',s.classe);const annual=s.per==='annuel';const ed=can('conseils','M');const dir=can('conseils','V');const P=curP();
  let h=pageHead('Conseils de classe & promotions',`${esc(c.nom)} • ${esc(anneeLib(S.annee))}`)+`<div class="card"><div class="bar"><div><label>Classe</label><select data-chg="ccC">${selOpts(cl.map(x=>[x.id,x.nom]),s.classe)}</select></div><div><label>Conseil</label><select data-chg="ccP">${selOpts([[1,'1er trimestre'],[2,'2ème trimestre'],[3,'3ème trimestre'],['annuel','Annuel (décisions & promotions)']],s.per)}</select></div></div>`;
  if(!annual){const R=calcClasse(c.id,+s.per);h+=tbl(['Rang','Élève','Moyenne','Appréciation proposée / arrêtée'],[...R.rows].sort((a,b)=>(a.rang||999)-(b.rang||999)).map(r=>[r.rang??'—',esc(eleveName(r.eleve)),fmtN(r.mg),esc(apprOf(r.insc.id,+s.per)?.texte||mention(r.mg,P.seuil)+' (suggestion)')]))+`<p class="muted small">Les appréciations se saisissent dans « Consolidation de classe ».</p></div>`;return h}
  const A=calcAnnuel(c.id);if(!A.stats.complet)h+=alertBox('Année <b>incomplète</b> : tous les trimestres ne sont pas validés. Les moyennes annuelles ci-dessous sont partielles (moyenne des trimestres disponibles).','w');
  h+=`<div class="tw"><table><thead><tr><th>Rang</th><th>Élève</th><th class="num">T1</th><th class="num">T2</th><th class="num">T3</th><th class="num">Moy. annuelle</th><th>Suggestion</th><th>Décision</th><th>Statut</th></tr></thead><tbody>${[...A.rows].sort((a,b)=>(a.rang||999)-(b.rang||999)).map(r=>{const d=decOf(r.insc.id);const sug=r.ma==null?'—':r.ma>=P.seuil?'Admis':'Redoublant';const lock=d&&(d.statut==='valide');
    return`<tr><td>${r.rang??'—'}</td><td>${esc(eleveName(r.eleve))}</td>${r.mgs.map(x=>`<td class="num">${fmtN(x)}</td>`).join('')}<td class="num"><b>${fmtN(r.ma)}</b></td><td class="muted">${sug}</td><td>${lock||!ed?esc(d?.decision||'—'):`<select data-dec="${r.insc.id}" style="min-width:120px"><option value="">—</option>${P.decisions.map(x=>`<option ${d?.decision===x?'selected':''}>${esc(x)}</option>`).join('')}</select>`}</td><td>${d?(d.statut==='valide'?badge('Validée','ok'):badge('Proposée','acc')):badge('—','mut')} ${lock&&dir?btn('Corriger','decFix',d.id,'ghost'):''}</td></tr>`}).join('')}</tbody></table></div>
  <div class="mfoot" style="justify-content:flex-start">${ed?btn('Enregistrer les décisions (proposition)','decSave','','')+btn('Appliquer les suggestions aux lignes vides','decSug','','ghost'):''}${dir?btn('Valider les décisions (direction)','decValid','','ok'):''}</div>`;
  if(dir){const plan=planPromotion(c.id);const nx=anneeSuivante(c.annee);h+=`<h3 style="margin-top:20px">Promotion automatique ${nx?'→ '+esc(nx.libelle):''}</h3><p class="muted small">N'intervient qu'après validation officielle des décisions par la direction. Crée la nouvelle inscription (admis → niveau supérieur ; redoublant → même niveau), conserve inscriptions, notes et bulletins antérieurs, journalise l'opération.</p>${tbl(['Élève','Décision','Action prévue','Destination / remarque'],plan.map(p=>[esc(eleveName(get('eleves',p.insc.eleve_id))),esc(p.d?.decision||'—'),p.act==='promote'?badge('Passage en '+nivNom(p.niv),'ok'):p.act==='redouble'?badge('Redoublement '+nivNom(p.niv),'warn'):badge('Aucune','mut'),esc(p.why)]))}<div class="mfoot" style="justify-content:flex-start">${btn('Exécuter la promotion de la classe','promoRun','','ok',plan.some(p=>p.act!=='none')?'':'disabled')}</div>`;
    const pr=all('promotions').filter(p=>p.statut!=='x'&&get('inscriptions',p.from_insc)?.classe_id===c.id);if(pr.length)h+=`<h4>Opérations de promotion</h4>${tbl(['Date','Élève','Vers','Statut',''],pr.map(p=>{const to=get('inscriptions',p.to_insc);return[fmtDate(p.date),esc(eleveName(get('eleves',to?.eleve_id))),esc(get('classes',to?.classe_id)?.nom||''),p.statut==='effectuee'?badge('Effectuée','ok'):badge('Annulée','bad'),p.statut==='effectuee'?btn('Annuler','promoCancel',p.id,'ghost'):esc(p.motif_annul||'')]}))}`}
  return h+'</div>'}};
ACT.chg_ccC=el=>{S.q.cc.classe=el.value;render()};ACT.chg_ccP=el=>{S.q.cc.per=el.value;render()};
ACT.decSug=()=>{const P=curP();const A=calcAnnuel(S.q.cc.classe);for(const r of A.rows){const sel=$(`[data-dec="${r.insc.id}"]`);if(sel&&!sel.value&&r.ma!=null)sel.value=r.ma>=P.seuil?'Admis':'Redoublant'}toast('Suggestions appliquées — à vérifier puis enregistrer','ok')};
ACT.decSave=()=>{need('conseils','M');const c=S.q.cc.classe;let n=0;for(const sel of $$('[data-dec]')){const i=sel.dataset.dec;const d=decOf(i);if(!sel.value)continue;if(d){if(d.statut==='valide')continue;if(d.decision===sel.value)continue;d.historique=[...(d.historique||[]),{t:nowISO(),par:S.user.login,de:d.decision,a:sel.value}];d.decision=sel.value;d.auteur=S.user.login;save('decisions',d);n++}else{save('decisions',{etab:S.etab,annee:S.annee,inscription_id:i,periode:'annuel',decision:sel.value,statut:'propose',auteur:S.user.login,date:today(),historique:[]});n++}}audit('décisions conseil','conseils',n+' décision(s) — '+get('classes',c)?.nom);toast(n+' décision(s) enregistrée(s)','ok');render()};
ACT.decValid=async()=>{need('conseils','V');needOnline('Validation des décisions du conseil');const A=calcAnnuel(S.q.cc.classe);const ds=A.rows.map(r=>decOf(r.insc.id)).filter(d=>d&&d.statut==='propose');if(!ds.length)throw new Error('Aucune décision en attente de validation');const nodec=A.rows.filter(r=>!decOf(r.insc.id)).length;if(!await askConfirm(`Valider officiellement ${ds.length} décision(s) ?${nodec?' '+nodec+' élève(s) sans décision.':''} Après validation, elles ne se corrigent que par la procédure de correction.`))return;for(const d of ds){d.statut='valide';d.valide_par=S.user.login;d.valide_le=nowISO();save('decisions',d)}audit('validation décisions','conseils',ds.length+' — '+A.cl.nom);toast('Décisions validées','ok');render()};
ACT.decFix=async el=>{need('conseils','V');needOnline('Correction d\'une décision');const d=get('decisions',el.dataset.id);if(all('promotions').some(p=>p.decision_id===d.id&&p.statut==='effectuee'))throw new Error('Une promotion a été effectuée : annulez-la d\'abord');openForm({title:'Correction d\'une décision validée',fields:[{k:'decision',label:'Nouvelle décision',type:'select',opts:curP().decisions,v:d.decision},{k:'motif',label:'Motif de la correction',req:1,type:'textarea',full:1}],onSave:f=>{d.historique=[...(d.historique||[]),{t:nowISO(),par:S.user.login,de:d.decision,a:f.decision,motif:f.motif}];d.decision=f.decision;save('decisions',d);audit('correction décision','conseils',f.motif)}})};
ACT.promoRun=async()=>{need('conseils','V');needOnline('Promotion définitive');const c=get('classes',S.q.cc.classe);const nx=anneeSuivante(c.annee);if(!nx)throw new Error('L\'année scolaire suivante n\'existe pas : le superadministrateur doit la créer (Paramétrage → Années)');const plan=planPromotion(c.id).filter(p=>p.act!=='none');if(!plan.length)throw new Error('Rien à promouvoir');if(!await askConfirm(`Créer ${plan.length} nouvelle(s) inscription(s) en ${nx.libelle} ? (${plan.filter(p=>p.act==='promote').length} passage(s), ${plan.filter(p=>p.act==='redouble').length} redoublement(s))`))return;
  for(const p of plan){const cls=findOrCreateClass(c.etab,nx.id,p.niv,c);ensureCoefs(c.etab,nx.id,p.niv,c.annee);const ni=save('inscriptions',{etab:c.etab,annee:nx.id,eleve_id:p.insc.eleve_id,classe_id:cls.id,statut:'inscrit',date:today(),source:'promotion'});save('promotions',{etab:c.etab,annee:c.annee,decision_id:p.d.id,from_insc:p.insc.id,to_insc:ni.id,auteur:S.user.login,date:today(),statut:'effectuee'})}
  audit('promotion','conseils',`${c.nom} → ${nx.libelle} : ${plan.length} élève(s)`);toast(plan.length+' élève(s) promu(s)/maintenu(s) en '+nx.libelle,'ok');render()};
ACT.promoCancel=async el=>{need('conseils','V');needOnline('Annulation de promotion');const p=get('promotions',el.dataset.id);const to=get('inscriptions',p.to_insc);if(all('notes').some(n=>n.inscription_id===to.id))throw new Error('Des notes existent déjà sur la nouvelle inscription : annulation impossible');const m=await askText('Annuler la promotion');if(!m)return;to.statut='annulee';save('inscriptions',to);p.statut='annulee';p.motif_annul=m;p.annule_par=S.user.login;save('promotions',p);audit('annulation promotion','conseils',m);render()};

MODS.finances={render(){const t=S.q.fi||'sit';const ed=can('finances','C');const tabs=[['sit','Situation des élèves'],['pay','Paiements & reçus'],['frais','Frais de scolarité'],['dep','Recettes & dépenses'],['caisse','Caisse & états']];

  const ins=activeInscEA();
  if(t==='sit'){const f=S.q.fiF||(S.q.fiF={cl:'',ar:''});const L=ins.filter(i=>(!f.cl||i.classe_id===f.cl)).map(i=>({i,f:finEleve(i)})).filter(x=>!f.ar||x.f.arriere>0);
    h+=`<div class="bar"><div><label>Classe</label><select data-chg="fiCl"><option value="">Toutes</option>${selOpts(rowsEA('classes').map(c=>[c.id,c.nom]),f.cl)}</select></div><div><label>Filtre</label><select data-chg="fiAr"><option value="">Tous les élèves</option><option value="1" ${f.ar?'selected':''}>Arriérés uniquement</option></select></div></div><div class="kpis">${kpi(fmtM(sum(L.map(x=>x.f.due))),'Total dû')}${kpi(fmtM(sum(L.map(x=>x.f.paid))),'Encaissé','g')}${kpi(fmtM(sum(L.map(x=>x.f.solde))),'Reste à recouvrer','w')}${kpi(fmtM(sum(L.map(x=>x.f.arriere))),'Arriérés exigibles','r')}</div>`+tbl(['Élève','Total dû','Payé','Solde','Exigible à ce jour','Arriéré',''],L.map(({i,f:x})=>[esc(inscLabel(i)),fmtM(x.due),fmtM(x.paid),x.solde>0?`<b>${fmtM(x.solde)}</b>`:badge('Soldé','ok'),fmtM(x.exigible),x.arriere>0?`<b class="low">${fmtM(x.arriere)}</b>`:'—',ed&&x.solde>0?btn('Encaisser','payNew',i.id,'ghost'):'']))}

  if(t==='dep'){const dep=rowsEA('depenses'),rec=rowsEA('recettes');h+=`<div class="cols"><div><h3>Dépenses ${can('finances','C')?btn('+ Dépense','depNew'):''}</h3>${tbl(['Date','Libellé','Catégorie','Montant'],dep.sort((a,b)=>b.date.localeCompare(a.date)).map(d=>[fmtDate(d.date),esc(d.libelle),esc(d.categorie),fmtM(d.montant)]))}</div><div><h3>Autres recettes ${can('finances','C')?btn('+ Recette','recNew'):''}</h3>${tbl(['Date','Libellé','Montant'],rec.map(d=>[fmtDate(d.date),esc(d.libelle),fmtM(d.montant)]))}</div></div>`}
  if(t==='caisse'){const pa=rowsEA('paiements'),rc=rowsEA('recettes'),dp=rowsEA('depenses');const modes=[...new Set([...pa,...rc,...dp].map(x=>x.mode))];const tr=sum(pa.map(p=>p.montant)),tre=sum(rc.map(p=>p.montant)),td=sum(dp.map(p=>p.montant));
    h+=`<div class="kpis">${kpi(fmtM(tr),'Recettes de scolarité','g')}${kpi(fmtM(tre),'Autres recettes')}${kpi(fmtM(td),'Dépenses','w')}${kpi(fmtM(tr+tre-td),'Solde général')}</div>${tbl(['Mode / caisse','Encaissements','Dépenses','Solde'],modes.map(m=>{const e=sum(pa.filter(x=>x.mode===m).map(x=>x.montant))+sum(rc.filter(x=>x.mode===m).map(x=>x.montant));const d=sum(dp.filter(x=>x.mode===m).map(x=>x.montant));return[esc(m),fmtM(e),fmtM(d),`<b>${fmtM(e-d)}</b>`]}))}${can('finances','X')?`<div class="mfoot" style="justify-content:flex-start">${btn('Exporter l\'état financier (Excel)','finX','','ghost')}${btn('Imprimer','finP','','ghost')}</div>`:''}`}
  return h}};

const IA_ASSISTANTS={enseignant:[['cours','Préparation de cours, QCM, sujets et corrigés',false],['remed','Remédiation et exercices guidés',false]],directeur:[['dir','Analyse des résultats et détection d\'anomalies',true],['ps','Synthèse de classe (professeur principal)',true],['adm','Aide à la rédaction administrative',false]],fondateur:[['stat','Analyse statistique et tendances',true],['adm','Aide à la rédaction administrative',false]],deps:[['stat','Analyse statistique et tendances',true]],drenaet:[['stat','Analyse statistique et tendances',true]],superadmin:[['adm','Aide à la rédaction administrative',false]],secretariat:[['adm','Aide à la rédaction, classement, synthèse',false]],intendant:[['adm','Aide à la rédaction administrative',false]],bibliothecaire:[['adm','Aide à la rédaction administrative',false]],archiviste:[['adm','Aide à la recherche documentaire',false]]};
function iaAssistants(){const a=[...(IA_ASSISTANTS[S.user.role]||[])];if(isPP())a.push(['ps','Synthèse de classe (professeur principal)',true]);return a}
function iaContext(kind){ // données agrégées et anonymisées uniquement
  if(kind==='none')return null;if(kind.startsWith('c:')){const R=calcClasse(kind.slice(2),S.q.iaT||1);return{portee:'classe',niveau:R.cl.niveau,effectif:R.stats.n,moyenne:R.stats.moy,min:R.stats.min,max:R.stats.max,taux_reussite_pct:R.stats.taux,seuil:R.stats.seuil,matieres:R.mats.map(m=>({matiere:m.nom,coef:m.coef,moyenne_classe:R.stats.parMat[m.code].moy})),notes_manquantes:R.miss,evaluations_non_validees:R.nonVal.length,distribution:[0,8,10,12,14,16].map((lo,k,a)=>({tranche:lo+'-'+(a[k+1]||20),n:R.rows.filter(r=>r.mg!=null&&r.mg>=lo&&r.mg<(a[k+1]||20.01)).length}))}}
  if(kind==='etab'){const s=statEtab(S.etab,S.q.iaT||1);return{portee:'établissement',effectif:s.eff,filles:s.F,garcons:s.M,classes:s.classes,moyenne:s.moy,taux_reussite_pct:s.taux,notes_manquantes:s.miss,par_niveau:Object.entries(s.parNiv).map(([n,v])=>({niveau:nivNom(n),effectif:v.eff,moyenne:v.mgs.length?r2(mean(v.mgs)):null}))}}return null}
function iaLocal(ctx,prompt){if(!ctx)return'Aucun service IA n\'est configuré et aucune donnée n\'est jointe : la génération de contenu (cours, QCM, rédaction) nécessite le service IA du backend. Configurez l\'adresse du service ci-dessus.';const L=['**Analyse locale automatique** (règles statistiques, sans modèle d\'IA générative)',''];
  if(ctx.portee==='classe'){L.push(`Classe de ${ctx.effectif} élèves : moyenne ${fmtN(ctx.moyenne)}/20, de ${fmtN(ctx.min)} à ${fmtN(ctx.max)} ; taux de réussite ${ctx.taux_reussite_pct}% (seuil ${ctx.seuil}).`);const ms=ctx.matieres.filter(m=>m.moyenne_classe!=null).sort((a,b)=>a.moyenne_classe-b.moyenne_classe);if(ms.length){L.push('Matières les plus fragiles : '+ms.slice(0,3).map(m=>`${m.matiere} (${fmtN(m.moyenne_classe)})`).join(', ')+'.');L.push('Matières les plus solides : '+ms.slice(-2).reverse().map(m=>`${m.matiere} (${fmtN(m.moyenne_classe)})`).join(', ')+'.');const low=ms.filter(m=>m.moyenne_classe<ctx.seuil);if(low.length)L.push(`⚠ ${low.length} matière(s) sous le seuil : prévoir une remédiation ciblée (${low.map(m=>m.matiere).join(', ')}).`)}
    if(ctx.notes_manquantes)L.push(`⚠ ${ctx.notes_manquantes} note(s) manquante(s) : les moyennes sont à confirmer.`);if(ctx.evaluations_non_validees)L.push(`⚠ ${ctx.evaluations_non_validees} évaluation(s) non validée(s) exclue(s) du calcul.`);const d=ctx.distribution;const fail=d.filter(x=>+x.tranche.split('-')[0]<8).reduce((a,x)=>a+x.n,0);if(fail)L.push(`${fail} élève(s) ont une moyenne inférieure à 8 : suivi individualisé conseillé (décision réservée au conseil de classe).`)}
  else{L.push(`Établissement : ${ctx.effectif} élèves (${ctx.filles} filles / ${ctx.garcons} garçons), ${ctx.classes} classes ; moyenne ${fmtN(ctx.moyenne)}, réussite ${ctx.taux_reussite_pct??'—'}%.`);const pn=ctx.par_niveau.filter(x=>x.moyenne!=null).sort((a,b)=>a.moyenne-b.moyenne);if(pn.length)L.push(`Niveau le plus en difficulté : ${pn[0].niveau} (${fmtN(pn[0].moyenne)}) ; le plus performant : ${pn[pn.length-1].niveau} (${fmtN(pn[pn.length-1].moyenne)}).`);if(ctx.notes_manquantes)L.push(`⚠ ${ctx.notes_manquantes} note(s) manquante(s).`)}
  L.push('','*Cette analyse est une aide : aucune décision (admission, redoublement, sanction, note) n\'est prise par l\'IA.*');return L.join('\n')}
MODS.ia={render(){const A=iaAssistants();const cfg=META.settings.ia||{};const cl=rowsEA('classes').filter(c=>S.user.role!=='enseignant');const s=S.q.ia||(S.q.ia={a:A[0]?.[0],ctx:'none',p:'',out:''});
  return pageHead('Assistant IA','Assistance pédagogique, administrative et statistique')+alertBox('<b>Règles de gouvernance :</b> l\'IA est un outil d\'assistance. Elle ne décide <b>jamais</b> seule d\'une admission, d\'un redoublement, d\'une sanction, d\'une note ou d\'une modification de dossier. Aucune clé d\'accès n\'est stockée dans le navigateur ; seules des <b>données agrégées et anonymes</b> peuvent être transmises ; chaque usage est journalisé.','i')+
  `<div class="cols"><div class="card"><h3>Poser une question</h3><div class="fld"><label>Assistant</label><select data-chg="iaA">${selOpts(A.map(([k,l])=>[k,l]),s.a)}</select></div><div class="fld" style="margin-top:8px"><label>Données jointes (agrégées, sans nom d'élève)</label><select data-chg="iaC"><option value="none">Aucune</option>${A.find(a=>a[0]===s.a)?.[2]?`<option value="etab" ${s.ctx==='etab'?'selected':''}>Statistiques de l'établissement</option>${cl.map(c=>`<option value="c:${c.id}" ${s.ctx==='c:'+c.id?'selected':''}>Statistiques de la classe ${esc(c.nom)}</option>`).join('')}`:''}</select></div><div class="fld" style="margin-top:8px"><label>Votre demande</label><textarea id="iaP" rows="5" placeholder="Ex. Propose une remédiation pour les matières faibles de cette classe…">${esc(s.p)}</textarea></div><div class="mfoot" style="justify-content:flex-start"><button class="btn" data-act="iaSend">Envoyer</button><button class="btn ghost" data-act="iaPreview">Voir les données qui seraient transmises</button></div></div>
  <div class="card"><h3>Réponse</h3><div id="iaOut" style="white-space:pre-wrap">${esc(s.out)||'<span class="muted">La réponse apparaîtra ici.</span>'}</div></div></div>
  <div class="card"><h3>Service IA (backend)</h3><p class="muted small">Adresse d'un service backend que vous hébergez (ex. fonction Supabase Edge) : il détient la clé du fournisseur de modèle, authentifie l'utilisateur et applique les quotas. Le navigateur n'envoie jamais de clé.</p><p>Adresse actuelle : <code>${esc(cfg.endpoint||'non configurée')}</code> ${can('sync','A')?btn('Configurer','iaCfg','','ghost'):''}</p>
  <h4>Journal d'usage</h4>${tbl(['Date','Utilisateur','Assistant','Mode','Données jointes','Taille'],rowsE('ia_usages').sort((a,b)=>b.t.localeCompare(a.t)).slice(0,10).map(u=>[fmtDT(u.t),esc(u.user),esc(u.assistant),esc(u.mode),esc(u.contexte),u.taille+' car.']))}</div>`}};

ACT.iaSend=async()=>{const s=S.q.ia;s.p=$('#iaP').value.trim();if(!s.p)throw new Error('Saisissez une demande');const ctx=iaContext(s.ctx);const ep=META.settings.ia?.endpoint;let out,mode;
  if(ep&&isOnline()){try{const r=await fetch(ep,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({assistant:s.a,role:S.user.role,demande:s.p,contexte:ctx}),signal:AbortSignal.timeout(30000)});if(!r.ok)throw new Error('HTTP '+r.status);const j=await r.json();out=j.text||j.reponse||JSON.stringify(j);mode='service'}catch(e){out='Le service IA n\'a pas répondu ('+e.message+').\n\n'+iaLocal(ctx,s.p);mode='local (repli)'}}
  else{out=iaLocal(ctx,s.p);mode='local'}
  s.out=out;save('ia_usages',{etab:S.etab,user:S.user.login,role:S.user.role,assistant:s.a,t:nowISO(),taille:s.p.length,contexte:ctx?'agrégé':'aucun',mode});audit('usage IA','ia',s.a+' / '+mode);render()};

MODS.sync={render(){const on=isOnline();const cnt=s=>QUEUE.filter(o=>o.status===s).length;const conf=QUEUE.filter(o=>o.status==='conflit');const rej=QUEUE.filter(o=>o.status==='rejete');const adm=can('sync','A');
  let h=pageHead('Synchronisation & mode hors connexion','Base centrale (simulée localement) ↔ IndexedDB de cet appareil',`<button class="btn ${on?'ghost':'acc'}" data-act="simOff">${META.simOffline?'Rétablir la connexion':'Simuler une coupure réseau'}</button><button class="btn" data-act="syncGo">Synchroniser maintenant</button>`)+
  `<div class="kpis">${kpi(on?'En ligne':'Hors ligne','État de la connexion',on?'g':'r')}${kpi(cnt('en_attente'),'Opérations en attente','w')}${kpi(conf.length,'Conflits',conf.length?'r':'')}${kpi(rej.length,'Rejetées',rej.length?'r':'')}${kpi(META.lastSync?fmtDT(META.lastSync):'—','Dernière synchronisation')}</div>`;

  if(conf.length){h+=`<div class="card"><h3>Conflits à résoudre</h3>${conf.map(o=>{const d=diffKeys(o.payload,o.server);return`<div style="border:1px solid var(--bd);border-radius:10px;padding:10px;margin-bottom:10px"><b>${esc(o.coll)}</b> — ${esc(labelOf(o.coll,o.payload))} <span class="muted small">(version de base ${o.base_v}, serveur v${o.server?._v})</span>${tbl(['Champ','Ma version (appareil)','Version du serveur'],d.map(k=>[esc(k),`<code>${esc(JSON.stringify(o.payload[k]))}</code>`,`<code>${esc(JSON.stringify(o.server?.[k]))}</code>`]))}${adm?`<div class="mfoot" style="justify-content:flex-start">${btn('Garder la version du serveur','cfSrv',o.op_id,'ghost')}${btn('Imposer ma version','cfLoc',o.op_id,'')}</div>`:'<p class="muted small">Seule la direction peut arbitrer ce conflit.</p>'}</div>`}).join('')}</div>`}
  if(rej.length)h+=`<div class="card"><h3>Opérations rejetées</h3>${tbl(['Module','Élément','Motif',''],rej.map(o=>[esc(o.coll),esc(labelOf(o.coll,o.payload)),esc(o.reason||''),btn('Annuler localement','rejDrop',o.op_id,'ghost')]))}</div>`;
  h+=`<div class="card"><h3>File d'opérations (100 dernières)</h3>${tbl(['Date','Module','Opération','Élément','Utilisateur','Appareil','Statut'],[...QUEUE].reverse().slice(0,100).map(o=>[fmtDT(o.t),esc(o.coll),esc(o.type)+(o.critical?' '+badge('critique','warn'):''),esc(labelOf(o.coll,o.payload)),esc(o.user),`<code>${esc(o.device)}</code>`,badge(...stQ[o.status]||[o.status])]))}</div>`;
  if(adm)h+=`<div class="card"><h3>Outils de test (recette §14)</h3><p class="muted small">Pour vérifier la gestion des conflits : 1) simulez une coupure ; 2) modifiez une note ; 3) cliquez « Simuler une modification concurrente » ; 4) rétablissez la connexion → un conflit apparaît.</p><div class="mfoot" style="justify-content:flex-start">${btn('Simuler une modification concurrente (autre appareil)','simConc','','ghost')}${btn('Récupérer les données du serveur','pullGo','','ghost')}</div></div>`;
  return h}};

ACT.simConc=()=>{const o=QUEUE.find(q=>q.status==='en_attente'&&q.type==='update'&&CLOUD.data[q.coll]?.[q.id]);if(!o)throw new Error('Aucune modification locale en attente sur un élément existant — modifiez d\'abord une note hors ligne');const cr=CLOUD.data[o.coll][o.id];cr._v++;if(o.coll==='notes'&&cr.valeur!=null)cr.valeur=cr.valeur+2<=20?cr.valeur+2:cr.valeur-2;else{const k=['titre','nom','libelle','objet'].find(k=>cr[k]);if(k)cr[k]=cr[k]+' (modifié sur un autre appareil)'}persistSoon();toast('Version du serveur modifiée — rétablissez la connexion pour provoquer le conflit','ok')};
ACT.cfSrv=async el=>{need('sync','A');const o=QUEUE.find(q=>q.op_id===el.dataset.id);if(!await askConfirm('Abandonner votre version et conserver celle du serveur ?'))return;col(o.coll)[o.id]=clone(o.server);o.status='synchronise';o.reason='conflit résolu : version serveur conservée';invalidate();audit('résolution conflit','sync',o.coll+' → serveur');persistSoon();render()};
ACT.cfLoc=async el=>{need('sync','A');needOnline('Résolution de conflit');const o=QUEUE.find(q=>q.op_id===el.dataset.id);const m=await askText('Imposer votre version (le serveur sera écrasé)');if(!m)return;o.base_v=o.server._v;o.status='en_attente';o.reason='conflit résolu : version locale imposée — '+m;audit('résolution conflit','sync',o.coll+' → local : '+m);syncNow();render()};
ACT.rejDrop=async el=>{const o=QUEUE.find(q=>q.op_id===el.dataset.id);const r=col(o.coll)[o.id];if(r&&r._v===0){r._del=true;invalidate()}QUEUE=QUEUE.filter(q=>q!==o);audit('annulation opération rejetée','sync',o.coll);persistSoon();render()};

/* ============ Sauvegarde & intégrité ============ */
function integrity(src,label){const g=c=>Object.values(src[c]||{}).filter(r=>!r._del);const ids=c=>new Set(g(c).map(r=>r.id));const R=[];const chk=(n,bad)=>R.push([label,n,bad.length?badge(bad.length+' anomalie(s)','bad'):badge('OK','ok'),bad.slice(0,3).join(' ; ')]);
  const el=ids('eleves'),cl=ids('classes'),ins=ids('inscriptions'),ev=ids('evaluations'),ex=ids('exemplaires');
  chk('Inscriptions → élèves / classes',g('inscriptions').filter(i=>!el.has(i.eleve_id)||!cl.has(i.classe_id)).map(i=>i.id));
  chk('Évaluations → classes',g('evaluations').filter(e=>!cl.has(e.classe_id)).map(e=>e.titre));
  chk('Notes → évaluations / inscriptions',g('notes').filter(n=>!ev.has(n.evaluation_id)||!ins.has(n.inscription_id)).map(n=>n.id));
  chk('Notes en double (évaluation × inscription)',(()=>{const s=new Set(),d=[];g('notes').forEach(n=>{const k=n.evaluation_id+'|'+n.inscription_id;s.has(k)?d.push(k):s.add(k)});return d})());
  chk('Notes hors barème',g('notes').filter(n=>{const e=src.evaluations?.[n.evaluation_id];return e&&n.etat==='note'&&n.valeur!=null&&(n.valeur<0||n.valeur>e.bareme)}).map(n=>n.id));
  chk('Matricules uniques (par établissement)',(()=>{const s=new Set(),d=[];g('eleves').forEach(e=>{const k=e.etab+'|'+e.matricule;s.has(k)?d.push(e.matricule):s.add(k)});return d})());
  chk('Paiements : référence unique + inscription',(()=>{const s=new Set(),d=[];g('paiements').forEach(p=>{const k=p.etab+'|'+p.reference;if(s.has(k)||!ins.has(p.inscription_id))d.push(p.reference);s.add(k)});return d})());
  chk('Décisions & promotions → inscriptions',[...g('decisions').filter(d=>!ins.has(d.inscription_id)).map(d=>d.id),...g('promotions').filter(p=>!ins.has(p.from_insc)||!ins.has(p.to_insc)).map(p=>p.id)]);
  chk('Emprunts → exemplaires',g('emprunts').filter(e=>!ex.has(e.exemplaire_id)).map(e=>e.id));
  chk('Un seul bulletin par classe × période',(()=>{const s=new Set(),d=[];g('bulletins').forEach(b=>{const k=b.classe_id+'|'+b.trimestre;s.has(k)?d.push(k):s.add(k)});return d})());return R}
MODS.backup={render(){const sa=can('backup','A');const loc=integrity(DB,'Appareil');const srv=S.user.role==='superadmin'?integrity(CLOUD.data,'Serveur'):[];

  alertBox('En production : sauvegardes automatiques PostgreSQL (copie indépendante), politique de rétention et <b>tests périodiques de restauration</b> (§11). Cette page fournit l\'export/restauration applicatif et les contrôles d\'intégrité exécutables à tout moment.','i')+`<div class="card"><h3>Contrôles d\'intégrité</h3>${tbl(['Source','Contrôle','Résultat','Exemples'],[...loc,...srv])}</div>
