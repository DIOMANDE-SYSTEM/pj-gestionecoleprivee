ACT.bkExp=async()=>{need('backup','X');const full=S.user.role==='superadmin';const data=full?CLOUD.data:DB;const body=JSON.stringify({app:'PERROQUET JUNIOR',v:1,t:nowISO(),portee:full?'serveur (complet)':'appareil',data,journal:full?CLOUD.journal:undefined});const h=await sha(body);dl('sauvegarde_perroquet_'+today()+'.json','application/json',JSON.stringify({sha256:h,body}));audit('export sauvegarde','backup',(full?'complète':'périmètre')+' '+h.slice(0,12))};
ACT.bkImp=()=>{need('backup','A');const inp=document.createElement('input');inp.type='file';inp.accept='.json';inp.onchange=async()=>{try{const f=JSON.parse(await inp.files[0].text());if(await sha(f.body)!==f.sha256)throw new Error('Somme de contrôle invalide : fichier altéré ou corrompu');const b=JSON.parse(f.body);if(b.app!=='PERROQUET JUNIOR'||b.portee!=='serveur (complet)')throw new Error('Ce fichier n\'est pas une sauvegarde complète');const m=await askText('Restauration : le serveur sera remplacé par la sauvegarde du '+fmtDT(b.t)+'. Tapez RESTAURER pour confirmer',{label:'Confirmation'});if(m!=='RESTAURER')throw new Error('Confirmation incorrecte');CLOUD.data=b.data;CLOUD.journal=b.journal||[];DB={};QUEUE=[];startSession(S.user);audit('restauration','backup',b.t);persistNow();toast('Sauvegarde restaurée','ok');render()}catch(e){toast(e.message,'err')}};inp.click()};
ACT.bkReset=async()=>{if(!await askConfirm('Effacer toutes les données et recharger le jeu de démonstration ?',{danger:true}))return;await Store.clear();location.reload()};

async function readAnyFile(f){const n=f.name.toLowerCase();const buf=await f.arrayBuffer();
  if(/\.xlsx$|\.xlsm$/.test(n)){const sh=await readXlsx(buf);if(!sh.length)throw new Error('Classeur vide');return{rows:sh[0].rows,sheets:sh.map(s=>s.name),kind:'Excel'}}
  if(/\.xls$/.test(n)){const head=b2s(new Uint8Array(buf).subarray(0,8));if(/^\xD0\xCF\x11\xE0/.test(head))throw new Error('Ancien format Excel binaire (.xls) non lisible : ouvrez-le dans Excel et enregistrez-le en .xlsx ou .csv');const d=new DOMParser().parseFromString(decodeText(buf),'text/html');const rows=[...d.querySelectorAll('tr')].map(tr=>[...tr.children].map(c=>c.textContent.trim()));return{rows:rows.filter(r=>r.some(c=>c)),kind:'Excel (HTML)'}}
  if(/\.csv$|\.txt$|\.tsv$/.test(n))return{rows:parseCSV(decodeText(buf)),kind:'CSV'};
  if(/\.docx$/.test(n)){const bl=await readDocx(buf);const tb=bl.find(b=>b.t==='tbl'&&b.rows.length>1);const rows=tb?tb.rows:bl.filter(b=>b.t==='p').map(b=>b.text.split(/\t|\s{2,}|;/).map(x=>x.trim()));return{rows,blocks:bl,kind:'Word'}}
  if(/\.doc$/.test(n)){const t=decodeText(buf);if(/<table/i.test(t)||/Content-Type: text\/html/i.test(t)){const d=new DOMParser().parseFromString(t.replace(/^[\s\S]*?(<html)/i,'$1'),'text/html');const rows=[...d.querySelectorAll('tr')].map(tr=>[...tr.children].map(c=>c.textContent.trim()));return{rows:rows.filter(r=>r.some(c=>c)),kind:'Word (HTML)'}}throw new Error('Ancien format Word (.doc) non lisible : enregistrez le document en .docx')}
  if(/\.pdf$/.test(n)){const lines=await readPdfText(buf);return{rows:lines.map(l=>l.split(/\t|\s{2,}/).map(x=>x.trim())),lines,kind:'PDF'}}
  throw new Error('Format non pris en charge. Formats acceptés : .xlsx, .csv, .docx, .pdf')}
function mapRows(cfg,rows){const want=cfg.cols.map(c=>[c.k,[normH(c.h),...(c.al||[]).map(normH),normH(c.k)]]);let best=-1,bs=0,bmap=null;
  for(let i=0;i<Math.min(rows.length,15);i++){const hn=rows[i].map(normH);const map={};let sc=0;want.forEach(([k,al])=>{const j=hn.findIndex(h=>al.includes(h));if(j>=0){map[k]=j;sc++}});if(sc>bs){bs=sc;best=i;bmap=map}}
  const need=cfg.cols.filter(c=>c.req).length;if(best<0||bs<Math.min(2,need)||cfg.cols.filter(c=>c.req).some(c=>bmap[c.k]==null))return{err:'En-têtes non reconnus. Colonnes attendues : '+cfg.cols.map(c=>c.h+(c.req?' *':'')).join(' • ')+'. Utilisez le modèle fourni.'};
  const out=rows.slice(best+1).map((r,ix)=>{const o={_row:best+ix+2};cfg.cols.forEach(c=>{const v=r[bmap[c.k]];o[c.k]=v==null?'':(typeof v==='number'?v:String(v).trim())});return o}).filter(o=>cfg.cols.some(c=>o[c.k]!==''));return{rows:out}}

  else if(f==='docx')dl(nm+'.docx','application/octet-stream',docxBlob('Modèle d\'import — '+cfg.title,['Remplissez le tableau ci-dessous (conservez la ligne d\'en-têtes, supprimez la ligne d\'exemple) puis importez ce fichier.','Colonnes marquées * : obligatoires.'],heads,rows));
  else if(f==='csv')dl(nm+'.csv','text/csv;charset=utf-8','﻿'+[heads,...rows].map(r=>r.map(c=>'"'+String(c).replace(/"/g,'""')+'"').join(';')).join('\r\n'));
  else if(f==='pdf')await exportPDF(nm,'Modèle d\'import — '+cfg.title,`<div class="bul"><h4>MODÈLE D'IMPORT — ${esc(cfg.title.toUpperCase())}</h4><p class="small">Ce PDF montre la structure attendue. Pour importer des données, préférez le modèle Excel ou Word ; un PDF « texte » dont les colonnes sont alignées reste importable.</p>${exTable(heads,rows)}</div>`)};
ACT.chg_imFile=async el=>{const f=el.files[0];if(!f)return;const st=S.q.imp,cfg=IMPORTS[st.k],box=$(S.q.impNested?'#modal2 #imRes':'#imRes');box.innerHTML='<div class="muted">Lecture du fichier…</div>';
  try{const rd=await readAnyFile(f);if(cfg.kind==='document'){st.res={doc:rd};box.innerHTML=await cfg.preview(rd,f);const g=$(S.q.impNested?'#modal2 #imGo':'#imGo');g.disabled=false;return}
    const mp=mapRows(cfg,rd.rows);if(mp.err)throw new Error(mp.err);if(!mp.rows.length)throw new Error('Aucune ligne de données trouvée');
    const x=cfg.prep?cfg.prep(st.ctx):{};const ok=[],bad=[];mp.rows.forEach(r=>{let e=null;try{e=cfg.check(r,x,st.ctx)}catch(er){e=er.message}if(e)bad.push([r._row,e]);else ok.push(r)});st.res={ok,bad,rd};
    box.innerHTML=`<div class="alert ${bad.length?'al-w':'al-i'}"><b>${esc(f.name)}</b> (${rd.kind}) : <span class="imp-ok">${ok.length} ligne(s) valide(s)</span> • <span class="imp-err">${bad.length} ligne(s) en erreur</span></div>${bad.length?`<div class="tw" style="max-height:170px"><table><thead><tr><th>Ligne</th><th>Problème</th></tr></thead><tbody>${bad.slice(0,40).map(b=>`<tr><td>${b[0]}</td><td class="imp-err">${esc(b[1])}</td></tr>`).join('')}</tbody></table></div>`:''}
    <div class="tw" style="max-height:190px;margin-top:8px"><table><thead><tr>${cfg.cols.map(c=>`<th>${esc(c.h)}</th>`).join('')}</tr></thead><tbody>${ok.slice(0,8).map(r=>`<tr>${cfg.cols.map(c=>`<td>${esc(r[c.k])}</td>`).join('')}</tr>`).join('')}</tbody></table></div>${ok.length>8?`<div class="muted small">… et ${ok.length-8} autre(s) ligne(s)</div>`:''}`;
    const g=$(S.q.impNested?'#modal2 #imGo':'#imGo');g.disabled=!ok.length;if(ok.length)g.textContent='Importer '+ok.length+' ligne(s) valide(s)'}
  catch(e){st.res=null;box.innerHTML=`<div class="alert al-r">${esc(e.message)}</div>`;const g=$(S.q.impNested?'#modal2 #imGo':'#imGo');if(g)g.disabled=true}};
ACT.imGo=async()=>{const st=S.q.imp,cfg=IMPORTS[st.k];if(!st?.res)return;need(...cfg.perm);
  if(cfg.kind==='document'){const m=await cfg.commit(st.res.doc);impClose();S.q.imp=null;toast(m,'ok');render();return}
  const n=st.res.ok.length;  try{const msg=cfg.commitA?await cfg.commitA(st.res.ok):cfg.commit(st.res.ok,st.ctx);impClose();S.q.imp=null;toast(msg,'ok');render()}catch(e){toast(e.message,'err')}};

IMPORTS.notes={title:'Notes d\'une évaluation',route:'notes',perm:['notes','M'],cols:[{k:'matricule',h:'Matricule',req:1},{k:'note',h:'Note',req:1,al:['notes','valeur'],help:'0 à barème ; A = absent ; D = dispensé ; vide = non saisi'}],sample:[['MAT-0001','14,5'],['MAT-0002','A']],
  prep(ctx){const map={};$$('[data-n]').forEach(i=>{map[normH(i.closest('tr').children[1].textContent)]=i});return{map,ev:ctx}},
  check(r,x){const i=x.map[normH(r.matricule)];if(!i)return'Matricule absent de cette classe';const raw=String(r.note).trim().replace(',','.');if(raw===''){r._v='';r._i=i;return}if(/^(a|abs)$/i.test(raw))r._v='A';else if(/^(d|disp)$/i.test(raw))r._v='D';else{const v=Number(raw);if(isNaN(v)||v<0||v>x.ev.bareme)return'Note invalide (0 à '+x.ev.bareme+', A ou D)';r._v=String(v).replace('.',',')}r._i=i},
  commit(rows){rows.forEach(r=>{r._i.value=r._v;r._i.style.outline='2px solid #f77f00'});return rows.length+' note(s) placée(s) dans la grille (surlignées en orange) : vérifiez puis cliquez « Enregistrer »'}};

const RP_TYPES={resultats:'Rapport de résultats scolaires',effectifs:'Rapport d\'effectifs et de structure',financier:'Rapport financier',vie:'Rapport de vie scolaire',synthese:'Synthèse du périmètre',libre:'Rapport libre (modèle)'};
const TRIM_LBL=t=>t+(t===1?'er':'ème')+' trimestre';
const sgn=(n,a,b)=>n>1?b:a;
function rpResultats(trim){const E=etabOf(S.etab),an=anneeLib(S.annee),s=statEtab(S.etab,trim),cls=rowsEA('classes').slice().sort((a,b)=>a.nom.localeCompare(b.nom));const R=cls.map(c=>({c,r:calcClasse(c.id,trim)}));const seuil=settingsOf(S.etab).seuil;const S2=[];
  S2.push({titre:'Contexte et effectifs',texte:`${E.nom} accueille ${s.eff} élèves (${s.F} filles et ${s.M} garçons) répartis en ${s.classes} classes pour l'année scolaire ${an}, avec ${s.ens} enseignant(s) actif(s).\nLes résultats présentés ci-dessous portent sur le ${TRIM_LBL(trim)} (évaluations validées uniquement ; seuil de réussite : ${seuil}/20).`,tab:{heads:['Niveau','Effectif','Moyenne générale'],rows:Object.entries(s.parNiv).map(([n,v])=>[nivNom(n),String(v.eff),v.mgs.length?fmtN(r2(mean(v.mgs))):'—'])}});
  S2.push({titre:'Résultats par classe',texte:s.moy==null?'Aucune moyenne n\'est encore calculable : les évaluations doivent être validées.':`La moyenne générale de l'établissement est de ${fmtN(s.moy)}/20 avec un taux de réussite de ${s.taux}%.`,tab:{heads:['Classe','Effectif','Moyenne','Min','Max','Réussite'],rows:R.map(({c,r})=>[c.nom,String(r.stats.n),fmtN(r.stats.moy),fmtN(r.stats.min),fmtN(r.stats.max),r.stats.taux==null?'—':r.stats.taux+' %'])}});
  const mm={};R.forEach(({r})=>r.mats.forEach(m=>{const v=r.stats.parMat[m.code]?.moy;if(v!=null)(mm[m.nom]||(mm[m.nom]=[])).push(v)}));const ms=Object.entries(mm).map(([n,a])=>[n,r2(mean(a)),a.filter(v=>v<seuil).length,a.length]).sort((a,b)=>a[1]-b[1]);
  S2.push({titre:'Analyse par matière',texte:ms.length?`Matières les plus fragiles : ${ms.slice(0,3).map(x=>`${x[0]} (${fmtN(x[1])})`).join(', ')}.\nMatières les plus solides : ${ms.slice(-2).reverse().map(x=>`${x[0]} (${fmtN(x[1])})`).join(', ')}.`:'Données insuffisantes.',tab:ms.length?{heads:['Matière','Moyenne (toutes classes)','Classes sous le seuil'],rows:ms.map(x=>[x[0],fmtN(x[1]),x[2]+' / '+x[3]])}:null});
  const low8=R.reduce((a,{r})=>a+r.rows.filter(x=>x.mg!=null&&x.mg<8).length,0);const al=[];if(s.miss)al.push(`- ${s.miss} note(s) manquante(s) : les moyennes concernées sont à confirmer.`);if(s.nonVal)al.push(`- ${s.nonVal} évaluation(s) non validée(s), exclue(s) du calcul.`);if(low8)al.push(`- ${low8} élève(s) ont une moyenne inférieure à 8/20.`);
  S2.push({titre:'Points d\'alerte',texte:al.length?al.join('\n'):'Aucun point d\'alerte majeur relevé par les données.',tab:null});
  const rec=[];ms.filter(x=>x[1]<seuil).forEach(x=>rec.push(`- Organiser une remédiation ciblée en ${x[0]} (moyenne ${fmtN(x[1])}).`));if(low8)rec.push('- Mettre en place un suivi individualisé des élèves en grande difficulté (décisions réservées aux conseils de classe).');if(s.miss||s.nonVal)rec.push('- Achever la saisie et la validation des évaluations avant l\'édition des bulletins.');
  S2.push({titre:'Recommandations (suggestions à valider)',texte:(rec.length?rec.join('\n'):'- Maintenir les dispositifs actuels d\'accompagnement.')+'\n\nCes suggestions sont générées à partir de règles statistiques ; elles ne constituent pas des décisions.',tab:null});
  S2.push({titre:'Conclusion',texte:'(À compléter par l\'auteur du rapport.)',tab:null});return S2}
function rpEffectifs(){const E=etabOf(S.etab),s=statEtab(S.etab,1),cls=rowsEA('classes').slice().sort((a,b)=>a.nom.localeCompare(b.nom));const rows=cls.map(c=>{const ins=activeInsc(c.id);const f=ins.filter(i=>get('eleves',i.eleve_id)?.sexe==='F').length;return[c.nom,nivNom(c.niveau),String(ins.length),String(c.capacite),Math.round(ins.length/c.capacite*100)+' %',String(f),String(ins.length-f)]});const cap=sum(cls.map(c=>c.capacite));
  return[{titre:'Structure de l\'établissement',texte:`${E.nom} (${E.code}) compte ${s.classes} classes et ${s.eff} élèves (${s.F} filles, ${s.M} garçons) pour une capacité de ${cap} places, soit un taux d'occupation de ${cap?Math.round(s.eff/cap*100):0} %.\nL'équipe pédagogique compte ${s.ens} enseignant(s) actif(s)${s.ens?` : ${fmtN(s.eff/s.ens,1)} élèves par enseignant en moyenne`:''}.`,tab:{heads:['Classe','Niveau','Effectif','Capacité','Occupation','Filles','Garçons'],rows}},{titre:'Observations',texte:'(À compléter : mouvements d\'élèves, transferts, abandons, besoins en salles et en personnel.)',tab:null}]}
function rpFinancier(){const E=etabOf(S.etab),ins=activeInscEA();const paid=sum(rowsEA('paiements').map(p=>p.montant)),rec=sum(rowsEA('recettes').map(p=>p.montant)),dep=sum(rowsEA('depenses').map(p=>p.montant));const fe=ins.map(i=>({i,f:finEleve(i)}));const due=sum(fe.map(x=>x.f.due)),solde=sum(fe.map(x=>x.f.solde));const byC={};fe.forEach(({i,f})=>{const n=get('classes',i.classe_id)?.nom||'?';const o=byC[n]||(byC[n]={due:0,paid:0,solde:0});o.due+=f.due;o.paid+=f.paid;o.solde+=f.solde});
  return[{titre:'Situation financière',texte:`Sur l'année ${anneeLib(S.annee)}, les scolarités encaissées s'élèvent à ${fmtM(paid)} pour ${fmtM(due)} attendus (taux de recouvrement : ${due?Math.round(paid/due*100):0} %). Les arriérés totalisent ${fmtM(solde)}.\nAutres recettes : ${fmtM(rec)} • Dépenses : ${fmtM(dep)} • Solde de trésorerie estimé : ${fmtM(paid+rec-dep)}.`,tab:{heads:['Poste','Montant'],rows:[['Scolarités attendues',fmtM(due)],['Scolarités encaissées',fmtM(paid)],['Arriérés',fmtM(solde)],['Autres recettes',fmtM(rec)],['Dépenses',fmtM(dep)],['Solde estimé',fmtM(paid+rec-dep)]]}},{titre:'Recouvrement par classe',texte:'',tab:{heads:['Classe','Attendu','Encaissé','Arriérés'],rows:Object.entries(byC).sort().map(([n,o])=>[n,fmtM(o.due),fmtM(o.paid),fmtM(o.solde)])}},{titre:'Observations et actions',texte:'(À compléter : plan de relance des arriérés, échéancier, difficultés rencontrées.)',tab:null}]}
function rpVie(){const cls=rowsEA('classes').slice().sort((a,b)=>a.nom.localeCompare(b.nom));const ab=rowsEA('absences');const rows=cls.map(c=>{const x=ab.filter(a=>a.classe_id===c.id);const A=x.filter(a=>a.type==='Absence').length,Rt=x.filter(a=>a.type==='Retard').length,J=x.filter(a=>a.justifiee).length;return[c.nom,String(A),String(Rt),x.length?Math.round(J/x.length*100)+' %':'—']});const T=ab.length,J=ab.filter(a=>a.justifiee).length;
  return[{titre:'Assiduité',texte:`${T} absence(s) et retard(s) ont été enregistrés cette année, dont ${J} justifié(s) (${T?Math.round(J/T*100):0} %).`,tab:{heads:['Classe','Absences','Retards','Part justifiée'],rows}},{titre:'Mesures et observations',texte:'(À compléter : mesures disciplinaires et éducatives, relations avec les parents.)',tab:null}]}
function rpSynthese(trim){const ets=[...S.scope].map(id=>etabOf(id)).filter(Boolean);const L=ets.map(e=>({e,s:statEtab(e.id,trim)}));const eff=sum(L.map(x=>x.s.eff));const mm=L.filter(x=>x.s.moy!=null).sort((a,b)=>a.s.moy-b.s.moy);
  return[{titre:'Vue d\'ensemble du périmètre',texte:`Le périmètre compte ${ets.length} établissement(s) et ${eff} élèves. Résultats du ${TRIM_LBL(trim)} (évaluations validées).${mm.length>1?`\nMoyenne la plus faible : ${mm[0].e.nom} (${fmtN(mm[0].s.moy)}) ; la plus élevée : ${mm[mm.length-1].e.nom} (${fmtN(mm[mm.length-1].s.moy)}).`:''}`,tab:{heads:['Établissement','Effectif','Filles','Classes','Moyenne','Réussite','Notes manquantes'],rows:L.map(({e,s})=>[e.nom,String(s.eff),String(s.F),String(s.classes),fmtN(s.moy),s.taux==null?'—':s.taux+' %',String(s.miss)])}},{titre:'Appréciation générale',texte:'(À compléter par l\'auteur du rapport.)',tab:null}]}
function rpLibre(){return['Introduction','Déroulement / activités menées','Difficultés rencontrées','Perspectives et recommandations','Conclusion'].map(t=>({titre:t,texte:'',tab:null}))}
function rpTypesAvail(){const t=['resultats','effectifs','vie'];if(can('finances','L'))t.push('financier');if(S.scope.size>1||['deps','drenaet','fondateur','superadmin'].includes(S.user.role))t.push('synthese');return t}
function rpBuild(type,trim){return type==='resultats'?rpResultats(trim):type==='effectifs'?rpEffectifs():type==='financier'?rpFinancier():type==='vie'?rpVie():type==='synthese'?rpSynthese(trim):rpLibre()}
const rpMd=t=>{const L=String(t||'').split('\n');let h='',ul=false;for(const l of L){const e=esc(l).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>');if(/^\s*-\s+/.test(l)){if(!ul){h+='<ul style="margin:4px 0 4px 18px">';ul=true}h+='<li>'+e.replace(/^\s*-\s+/,'')+'</li>'}else{if(ul){h+='</ul>';ul=false}if(l.trim())h+='<p>'+e+'</p>'}}return h+(ul?'</ul>':'')};
function rapportHtml(r){const an=anneeLib(r.annee||S.annee);return`<div class="bul rpt"><h3>${esc(r.titre)}</h3><div class="center small muted">${esc(RP_TYPES[r.type]||'Rapport')} • ${esc(r.periode||'')} • Année scolaire ${esc(an)}</div>${(r.sections||[]).map((s,i)=>`<h5>${i+1}. ${esc(s.titre)}</h5>${rpMd(s.texte)}${s.tab?exTable(s.tab.heads,s.tab.rows):''}`).join('')}<p class="small" style="margin-top:12px">${r.statut==='valide'?`Rapport validé le ${fmtDate(r.valide_le)} par ${esc(r.valide_par||'la direction')}.`:'<i>Brouillon — non validé.</i>'}${r.mode==='ia'?' <i>Brouillon élaboré avec l\'aide d\'une analyse automatique des données, relu par l\'auteur.</i>':''}</p></div>`}

const rpState=()=>S.q.rp;
function rpCollect(){const st=rpState();if(!st||!$('#rpT'))return;st.titre=$('#rpT').value;st.type=$('#rpTy').value;st.periode=$('#rpP').value;$$('.rps').forEach(d=>{const i=+d.dataset.i;if(st.sections[i]){st.sections[i].titre=d.querySelector('.rpst').value;st.sections[i].texte=d.querySelector('.rpsx').value}})}

  ${st.iaAsk?`<div class="alert al-w">Le texte des sections sera transmis au service IA configuré (${esc(META.settings.ia?.endpoint||'non configuré')}) pour reformulation. Ne saisissez aucune donnée nominative dans les sections. <button class="btn sm" data-act="rpIAgo">Confirmer l'envoi</button> <button class="btn sm ghost" data-act="rpIAno">Annuler</button></div>`:''}
  <div style="max-height:52vh;overflow:auto;margin-top:8px" id="rpSecs">${st.sections.map((s,i)=>`<div class="rps" data-i="${i}"><div style="display:flex;gap:8px;margin-bottom:6px"><input class="rpst" value="${esc(s.titre)}" ${dis} style="font-weight:700"><button class="btn sm bad" data-act="rpDelSec" data-id="${i}" ${dis}>✕</button></div><textarea class="rpsx" rows="${Math.min(10,Math.max(3,(s.texte||'').split('\n').length+1))}" ${dis}>${esc(s.texte||'')}</textarea>${s.tab?`<div class="tw" style="margin-top:6px;max-height:160px"><table><thead><tr>${s.tab.heads.map(h=>`<th>${esc(h)}</th>`).join('')}</tr></thead><tbody>${s.tab.rows.map(r=>`<tr>${r.map(c=>`<td>${esc(c)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>${lock?'':`<button class="btn sm ghost" style="margin-top:4px" data-act="rpDelTab" data-id="${i}">Retirer le tableau</button>`}`:''}</div>`).join('')}</div>
  <div class="mfoot" style="flex-wrap:wrap"><button class="btn ghost" data-act="closeModal">Fermer</button>${lock?'':`<button class="btn ghost" data-act="rpAddSec">+ Section</button><button class="btn ghost" data-act="rpIA">✨ Améliorer la rédaction (service IA)</button>`}${can('rapports','X')?`<button class="btn ghost" data-act="rpPdf" data-id="">📕 PDF</button><button class="btn ghost" data-act="rpDoc" data-id="">📘 Word</button><button class="btn ghost" data-act="rpPrint" data-id="">🖨 Imprimer</button>`:''}${lock?(can('rapports','V')?'<button class="btn ghost" data-act="rpReopen">Rouvrir</button>':''):`<button class="btn" data-act="rpSave">Enregistrer le brouillon</button>${can('rapports','V')?'<button class="btn ok" data-act="rpValid">Valider le rapport</button>':''}`}</div>`,{wide:true})}

ACT.rpAiGo=()=>{const t=$('#aiT').value,p=+$('#aiP').value;const secs=rpBuild(t,p);S.q.rp={id:null,titre:RP_TYPES[t]+' — '+etabOf(S.etab).nom,type:t,periode:['resultats','synthese'].includes(t)?TRIM_LBL(p)+' '+anneeLib(S.annee):'Année scolaire '+anneeLib(S.annee),mode:'ia',statut:'brouillon',sections:secs};audit('génération rapport IA','rapports',t);rpEditor()};

ACT.rpValid=async()=>{need('rapports','V');rpCollect();const st=rpState();if(!st.titre.trim())throw new Error('Le titre est obligatoire');const rec=save('rapports',{...(st.id?get('rapports',st.id):{etab:S.etab,annee:S.annee}),titre:st.titre.trim(),type:st.type,periode:st.periode,mode:st.mode,sections:st.sections,statut:'valide',auteur:st.auteur||S.user.nom,date:st.date||today(),valide_par:S.user.nom,valide_le:nowISO()});st.id=rec.id;audit('rapport validé','rapports',rec.titre);toast('Rapport validé','ok');closeModal();render()};

ACT.rpDoc=el=>{need('rapports','X');const r=rpCur(el);exportDOC(slug(r.titre||'rapport'),r.titre,rapportHtml(r))};

ACT.rpIAgo=async()=>{rpCollect();const st=rpState();st.iaAsk=false;const ep=META.settings.ia?.endpoint;if(!ep||!isOnline()){rpEditor();throw new Error(ep?'Hors connexion : le service IA est inaccessible':'Service IA non configuré (menu Assistant IA → Configurer). Le brouillon automatique reste utilisable tel quel.')}
  let n=0;try{for(const s of st.sections){if((s.texte||'').trim().length<40)continue;const r=await fetch(ep,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({assistant:'redaction',role:S.user.role,demande:'Reformule en style administratif clair, sans modifier les chiffres ni ajouter d\'information : '+s.texte,contexte:null}),signal:AbortSignal.timeout(30000)});if(!r.ok)throw new Error('HTTP '+r.status);const j=await r.json();const t=j.text||j.reponse;if(t){s.texte=String(t);n++}}save('ia_usages',{etab:S.etab,user:S.user.login,role:S.user.role,assistant:'redaction rapport',t:nowISO(),taille:n,contexte:'texte du rapport',mode:'service'});audit('usage IA','ia','rapport / '+n+' section(s)');toast(n+' section(s) reformulée(s) — relisez avant de valider','ok')}catch(e){toast('Le service IA n\'a pas répondu ('+e.message+')','err')}
  rpEditor()};

  async preview(rd,f){const S2=rdToSections(rd,f.name);S.q.imp.res.sections=S2;return`<div class="alert al-i"><b>${esc(f.name)}</b> (${rd.kind}) : ${S2.length} section(s) détectée(s).</div><div class="tw" style="max-height:200px"><table><thead><tr><th>Section</th><th>Aperçu</th></tr></thead><tbody>${S2.slice(0,12).map(s=>`<tr><td><b>${esc(s.titre)}</b></td><td class="small">${esc((s.texte||(s.tab?'Tableau de '+s.tab.rows.length+' ligne(s)':'')).slice(0,140))}</td></tr>`).join('')}</tbody></table></div>`},
  commit(rd){const S2=S.q.imp.res.sections;const rec=save('rapports',{etab:S.etab,annee:S.annee,titre:S.q.imp.res.title||'Rapport importé',type:'libre',periode:'',mode:'importe',statut:'brouillon',auteur:S.user.nom,date:today(),sections:S2});audit('import rapport','rapports',rec.titre);return'Rapport importé en brouillon : relisez-le avant validation'}};
function rdToSections(rd,fname){const base=fname.replace(/\.[^.]+$/,'');S.q.imp.res.title=base;
  if(rd.blocks){const out=[];let cur=null;const open=t=>{cur={titre:t,texte:'',tab:null};out.push(cur)};let first=true;for(const b of rd.blocks){if(b.t==='p'){if(b.h){if(first){S.q.imp.res.title=b.text;first=false;continue}open(b.text)}else{first=false;if(!cur)open('Contenu');cur.texte+=(cur.texte?'\n':'')+b.text}}else{first=false;if(!cur)open('Tableau');if(cur.tab)open('Tableau');cur.tab={heads:b.rows[0],rows:b.rows.slice(1).map(r=>b.rows[0].map((_,i)=>r[i]??''))}}}return out.length?out:[{titre:'Contenu',texte:'',tab:null}]}
  if(rd.lines){const L=rd.lines.map(l=>l.replace(/\t/g,'  '));return[{titre:'Contenu importé',texte:L.join('\n'),tab:null}]}
  const r=rd.rows;return[{titre:'Données importées',texte:'',tab:{heads:r[0].map(String),rows:r.slice(1).map(x=>r[0].map((_,i)=>String(x[i]??'')))}}]}

/* ===== Guide de formation intégré (début du menu latéral) — consultable, téléchargeable en PDF / Word, imprimable ===== */
const TRAIN_ROLE={
 fondateur:['<b>Tableau de bord</b> : vue consolidée de vos établissements.','<b>Finances</b> et <b>Bulletins</b> : consultation et export.','<b>Rapports</b> et <b>Signature & cachet</b>.'],
 directeur:['<b>Paramétrage pédagogique</b> : année, classes, coefficients, barèmes.','<b>Utilisateurs</b> : créer les comptes internes (enseignants avec leur discipline, secrétaire, intendant…).','<b>Évaluations, Bulletins, Conseils</b> : valider les notes, les bulletins et les décisions.','<b>Signature & cachet</b> : enregistrer le logo, le cachet et votre signature.'],
 correspondant:['<b>Élèves</b> : inscriptions, dossiers, import de listes (Excel, Word, PDF).','<b>Utilisateurs</b> : créer et paramétrer les comptes internes de l\'établissement.','<b>Courriers</b> et <b>Archives</b> : enregistrer et classer.','<b>Rapports</b> : rédiger, importer, exporter.'],
 secretariat:['<b>Élèves</b> : inscriptions et dossiers.','<b>Courriers</b> : enregistrement, numérotation, suivi.','<b>Vie scolaire</b> et <b>Archives</b>.'],
 intendant:['<b>Finances</b> : frais de scolarité, paiements (reçu automatique), arriérés, recettes et dépenses.','Import des paiements depuis Excel (les doublons sont refusés).','<b>Rapports</b> financiers.'],
 bibliothecaire:['<b>Bibliothèque</b> : ouvrages, exemplaires, prêts et retours.','<b>Rapports</b> de la bibliothèque.'],
 archiviste:['<b>Archives</b> : dépôt des documents, durée de conservation, alertes d\'échéance.'],
 enseignant:['<b>Évaluations & notes</b> : créer une évaluation, saisir, puis soumettre à la direction.','<b>Vie scolaire</b> : absences et retards.','Professeur principal : <b>Consolidation de classe</b> (notes manquantes, appréciations).']};
const TRAIN_ENCADREUR=['<b>Vie scolaire</b> : suivre les absences et les retards des élèves de vos classes.','<b>Classes</b> et <b>Élèves</b> : consulter les effectifs et les dossiers.','Votre fonction (Encadreur(se) / Éducateur(trice)) est enregistrée dans votre compte par la direction.'];
function trainHtml(){
 const r=S.user?.role,enc=r==='enseignant'&&/encadreur|[eé]ducat/i.test(S.user?.discipline||'');
 const mine=enc?TRAIN_ENCADREUR:(TRAIN_ROLE[r]||[]);
 const li=a=>`<ul>${a.map(x=>`<li>${x}</li>`).join('')}</ul>`;
 const tb=(h,rows)=>`<table><thead><tr>${h.map(x=>`<th>${x}</th>`).join('')}</tr></thead><tbody>${rows.map(c=>`<tr>${c.map(x=>`<td>${x}</td>`).join('')}</tr>`).join('')}</tbody></table>`;
 return `<div class="dh"><div class="dl"><img class="lg" src="${IMG.parrot}"></div><div class="dc"><b>PERROQUET JUNIOR</b><div>Système intégré de gestion des établissements secondaires privés</div></div><div class="dr"><img class="ar" src="${IMG.arm}"></div></div><h4 style="font-size:17px">GUIDE DE FORMATION — PERROQUET JUNIOR</h4><div class="center small muted" style="margin-bottom:8px">Plateforme de gestion des établissements secondaires privés • version abrégée</div>
${mine.length?`<h5>Pour votre profil : ${esc(ROLES[r]||'')}${enc?' — Encadreur(se) / Éducateur(trice)':''}</h5>${li(mine)}`:''}
<h5>1. À quoi sert la plateforme</h5><p>PERROQUET JUNIOR gère la vie d'un collège ou d'un lycée privé : élèves et classes, notes et bulletins, finances, bibliothèque, archives, courriers et rapports. Elle s'ouvre dans un navigateur (ordinateur, tablette, téléphone), peut s'installer comme une application et continue de fonctionner sans connexion : les opérations sont mises en attente, puis synchronisées.</p>
<h5>2. Se connecter</h5>${li(['Saisir l\'identifiant et le mot de passe remis par la direction ; le bouton 👁 permet de vérifier la saisie.','Après 5 essais ratés, le compte est bloqué 5 minutes. La session se ferme après 30 minutes d\'inactivité.','Changer son mot de passe : cliquer sur son nom (en haut), puis « Changer mon mot de passe » — 8 caractères minimum, lettres et chiffres.','Mot de passe oublié : demander sa réinitialisation à la direction (ou au correspondant fichier pour les comptes internes).'])}
<h5>3. S'orienter</h5><p>Le menu latéral n'affiche que les rubriques autorisées à votre profil. Le bandeau de chaque page rappelle l'établissement et l'année scolaire. Les listes proposent les boutons <b>Importer</b> et <b>Exporter</b> selon vos droits.</p>
<h5>4. Les profils en bref</h5>${tb(['Profil','Mission','Rubriques principales'],[
['Fondateur','Suivi de ses établissements','Vue consolidée, Finances, Bulletins'],
['Directeur des études','Pilote l\'établissement et valide','Paramétrage, Notes, Bulletins, Conseils, Comptes internes'],
['Correspondant fichier','Fichier des élèves et comptes internes','Élèves, Utilisateurs, Courriers, Archives'],
['Secrétariat','Scolarité et courriers','Élèves, Courriers, Vie scolaire'],
['Intendant','Finances de l\'établissement','Finances'],
['Bibliothécaire / Archiviste','Ouvrages et prêts / archives','Bibliothèque / Archives'],
['Enseignant (professeur, encadreur(se), éducateur(trice))','Notes et vie scolaire','Évaluations & notes, Vie scolaire, Consolidation (professeur principal)']])}
<h5>5. Le parcours de l'année</h5><ol><li><b>Paramétrage</b> (direction) : année scolaire, classes, coefficients, barèmes.</li><li><b>Élèves</b> : inscription, dossier (photo, pièces, responsable), affectation en classe.</li><li><b>Enseignants & affectations</b> : relier chaque enseignant à ses classes et matières.</li><li><b>Notes</b> : l'enseignant crée l'évaluation, saisit, soumet ; la direction valide.</li><li><b>Consolidation</b> : le professeur principal contrôle les notes manquantes et rédige les appréciations.</li><li><b>Bulletins</b> : génération, validation et archivage par la direction ; impression ou PDF.</li><li><b>Conseil de classe</b> : décisions, puis promotion automatique contrôlée.</li></ol>
<h5>6. Saisir les notes</h5>${li(['<b>0</b> est une vraie note ; <b>A</b> = absent ; <b>D</b> = dispensé ; case vide = non saisie. Absent, dispensé et non saisi sont exclus du calcul mais signalés.','La virgule est acceptée (14,5). Une note supérieure au barème est refusée.','Les notes peuvent être importées depuis un fichier Excel dans la grille de saisie (bouton Importer).','Après soumission et validation, les notes sont verrouillées.'])}
<h5>7. Importer et exporter</h5>${li(['<b>Importer</b> : choisir Excel, Word, PDF ou CSV ; un modèle est téléchargeable dans la même fenêtre. Un aperçu liste les lignes valides et les erreurs ; rien n\'est enregistré avant votre confirmation.','Le PDF importé doit contenir du texte (un PDF scanné n\'est pas lu). Les anciens formats .doc et .xls ne sont pas lus : les enregistrer en .docx / .xlsx.','<b>Exporter</b> : Excel, Word, PDF, CSV ou impression. Tous les documents portent l\'en-tête officiel (logo de l\'établissement à gauche, armoirie à droite).'])}
<h5>8. Rapports</h5><p>La rubrique <b>Rapports</b> permet de rédiger un rapport à la main, de le faire préparer à partir des statistiques de l'établissement (brouillon sans aucun nom d'élève, à relire) ou d'importer un document Word / PDF. La direction valide ; le rapport validé est verrouillé et s'exporte en PDF.</p>
<h5>9. Signature et cachet</h5>${li(['Rubrique <b>Signature & cachet</b> : dessiner sa signature à la souris, au doigt ou au stylet.','Le logo et le cachet de l\'établissement (direction) s\'importent depuis une image ou se photographient ; le fond est retiré automatiquement.','Signature et cachet s\'impriment sur les documents exportés ; les bulletins ne les portent qu\'après validation.'])}
<h5>10. Sans connexion et synchronisation</h5><p>Sans réseau, le travail continue. La rubrique <b>Synchronisation</b> montre l'état de chaque opération : En attente, En cours, Synchronisé, Conflit, Rejeté. En cas de conflit, comparer les deux versions et choisir : rien n'est écrasé silencieusement. Les validations finales exigent d'être connecté.</p>
<h5>11. Bonnes pratiques</h5>${li(['Ne jamais communiquer son mot de passe ; se déconnecter sur un appareil partagé.','Ne saisir aucun nom d\'élève dans l\'Assistant IA.','Relire avant de valider : une validation verrouille les données.','La direction exporte régulièrement une sauvegarde (Sauvegarde & intégrité).'])}
<h5>12. Dépannage</h5>${tb(['Problème','Que faire'],[['Compte bloqué','Attendre 5 minutes, puis réessayer ; sinon demander une réinitialisation.'],['Une rubrique est absente','Elle n\'est pas prévue pour votre profil : en parler à la direction.'],['Import refusé','Télécharger le modèle, corriger les lignes signalées, recommencer.'],['Données non à jour','Ouvrir Synchronisation et vérifier la connexion.'],['Texte du PDF non sélectionnable','Utiliser Imprimer, puis « Enregistrer au format PDF ».']])}`}

(async function boot(){

  if(S.user)render();else showLogin();
  window.__ready=true;
